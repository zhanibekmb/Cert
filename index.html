<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cert — The Streak You Can't Fake</title>
<meta name="description" content="Set one goal. Send live proof every day — a photo, a video, or a location check-in. An AI judge decides if it counts. Free on the App Store.">
<meta property="og:title" content="Cert — The Streak You Can't Fake">
<meta property="og:description" content="One goal. Live proof every day. An AI judge decides if it counts. Free on the App Store.">
<meta property="og:type" content="website">
<link rel="icon" type="image/png" href="assets/logo-mark.png">
<style>
  :root{
    --accent:#4f46e5; --accent-deep:#4338ca; --accent-soft:#eef2ff;
    --ink:#0d0f14; --mute:#5c626e; --faint:#9aa0ac;
    --bg:#ffffff; --card:#fafafb; --line:#ececef; --line-2:#e2e3e8;
    --err:#dc2626; --ok:#16a34a;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  html,body{margin:0;padding:0;background:var(--bg);}
  body{font-family:var(--font);color:var(--ink);overflow-x:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;letter-spacing:-.011em;line-height:1.5;}
  ::selection{background:var(--accent);color:#fff;}
  a{color:inherit;text-decoration:none;}
  img{display:block;max-width:100%;}
  .wrap{max-width:1120px;margin:0 auto;padding:0 24px;}
  h1,h2,h3,h4{margin:0;font-weight:640;letter-spacing:-.028em;line-height:1.05;color:var(--ink);}
  h1{font-size:clamp(38px,5.4vw,62px);font-weight:660;letter-spacing:-.035em;}
  h2{font-size:clamp(28px,3.6vw,42px);}
  .lead{font-size:clamp(17px,1.6vw,19px);line-height:1.55;color:var(--mute);font-weight:400;letter-spacing:-.01em;}
  .sub{font-size:16.5px;line-height:1.6;color:var(--mute);font-weight:400;}
  .kicker{display:inline-block;font-size:12.5px;font-weight:600;letter-spacing:.04em;color:var(--accent);}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;}
  .chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13.5px;font-weight:500;color:var(--mute);background:#fff;}
  .chip svg{width:15px;height:15px;color:var(--accent);flex:none;}
  .icon-box{width:42px;height:42px;border-radius:11px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;color:var(--accent);flex:none;}
  .icon-box svg{width:21px;height:21px;}
  /* store buttons */
  .store{display:inline-flex;align-items:center;gap:9px;background:var(--ink);color:#fff;border-radius:13px;padding:10px 18px;transition:transform .15s,opacity .15s;}
  .store:hover{transform:translateY(-1px);opacity:.92;}
  .store small{display:block;font-size:10px;font-weight:500;opacity:.82;letter-spacing:.01em;line-height:1.1;}
  .store b{display:block;font-size:16px;font-weight:600;line-height:1.2;letter-spacing:-.01em;}
  .store.mini{padding:7px 11px;border-radius:10px;gap:7px;}
  .store.mini svg{width:13px;height:15px;flex:none;}
  .store.mini small{font-size:8.5px;line-height:1;}
  .store.mini b{font-size:13px;line-height:1.08;}
  .store.lg{padding:12px 22px;}
  .store.mini{padding:6px 12px;border-radius:10px;gap:7px;}
  .store.mini small{font-size:8.5px;}
  .store.mini b{font-size:12.5px;}
  .store.soon{background:#fff;color:var(--ink);border:1px solid var(--line-2);}
  .btn{display:inline-flex;align-items:center;gap:9px;background:var(--ink);color:#fff;border:none;border-radius:12px;padding:13px 24px;font:inherit;font-weight:600;font-size:15.5px;cursor:pointer;transition:transform .15s,opacity .15s;letter-spacing:-.01em;}
  .btn:hover{transform:translateY(-1px);opacity:.92;}
  .navlink{font-size:14px;font-weight:500;color:var(--mute);transition:color .15s;}
  .navlink:hover{color:var(--ink);}
  .lang-btn{background:none;border:none;padding:5px 8px;font:inherit;font-size:12.5px;font-weight:600;color:var(--faint);cursor:pointer;border-radius:7px;}
  .lang-btn.active{background:var(--ink);color:#fff;}
  .live{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:500;color:var(--mute);}
  .live .dot{width:7px;height:7px;border-radius:5px;background:var(--ok);animation:pulse 1.8s ease infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.25;}}
  /* accordion */
  .acc-q{width:100%;text-align:left;background:none;border:none;padding:20px 0;font:inherit;font-size:16.5px;font-weight:600;color:var(--ink);cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:14px;letter-spacing:-.01em;}
  .acc-q:hover{color:var(--accent);}
  .acc-a{display:none;padding:0 0 20px;color:var(--mute);font-size:15px;line-height:1.65;max-width:640px;}
  .acc-item{border-bottom:1px solid var(--line);}
  .acc-item.open .acc-a{display:block;}
  .acc-item.open .acc-x{transform:rotate(45deg);}
  .acc-x{transition:transform .18s;color:var(--faint);font-size:20px;font-weight:400;flex:none;}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:40px;}

  /* ---------- realistic device ---------- */
  .device{position:relative;width:296px;flex:none;border-radius:52px;
    background:linear-gradient(150deg,#ffffff,#e7e9ef 50%,#fcfcff);
    padding:3px;box-shadow:0 0 0 1px #e0e2e9,0 30px 64px -26px rgba(13,15,20,.42),0 10px 24px -14px rgba(13,15,20,.32);}
  .device .bezel{background:#eef0f4;border-radius:49px;padding:9px;box-shadow:0 0 0 1px #e4e6ec inset;}
  .device .screen{position:relative;border-radius:40px;overflow:hidden;background:#fff;aspect-ratio:1170/2532;display:flex;flex-direction:column;border:1px solid #e6e8ef;}
  .device .screen.real-screen{display:block;}
  .device .island{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:90px;height:27px;background:#000;border-radius:16px;z-index:8;}
  .device .shot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top center;}
  .device.stack .shot{opacity:0;transition:opacity .55s ease;}
  .device.stack .shot.on{opacity:1;}
  /* live status bar */
  .sbar{position:relative;display:flex;align-items:center;justify-content:space-between;padding:14px 26px 0;height:47px;z-index:7;}
  .sbar .t{font-size:14.5px;font-weight:600;letter-spacing:-.02em;color:#0d0f14;}
  .sbar .st{display:flex;gap:6px;align-items:center;}
  /* live create-screen (matches the app) */
  .cs{position:relative;flex:1;display:flex;flex-direction:column;padding:2px 18px 20px;}
  .shot-stage{position:absolute;inset:0;overflow:hidden;background:#fff;}
  .screen.real-screen .cs{position:absolute;inset:0;min-height:0;}
  .shot-stage .shot{opacity:0;height:108%;top:-5%;bottom:auto;transform:scale(1.035);transition:opacity .45s ease,transform .65s cubic-bezier(.2,.8,.2,1);}
  .shot-stage .shot.on{opacity:1;transform:scale(1);}
  .proof-switch{position:absolute;left:16px;right:16px;bottom:22px;z-index:7;display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:5px;border:1px solid rgba(226,227,232,.9);border-radius:15px;background:rgba(255,255,255,.94);box-shadow:0 18px 36px -24px rgba(13,15,20,.45);backdrop-filter:blur(10px);}
  .proof-switch span{min-width:0;text-align:center;border-radius:11px;padding:8px 4px;color:var(--mute);font-size:11px;font-weight:650;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .proof-switch span.on{background:var(--accent);color:#fff;box-shadow:0 5px 12px -7px rgba(79,70,229,.8);}
  .proof-switch.pop span.on{animation:pillIn .36s cubic-bezier(.2,.8,.2,1);}
  .cs-back{font-size:15px;color:var(--mute);font-weight:400;margin:2px 0 8px;}
  .cs-title{font-size:25px;font-weight:700;letter-spacing:-.025em;margin:0 0 16px;}
  .cs-seg{display:flex;background:#f2f3f6;border-radius:12px;padding:3px;margin-bottom:15px;}
  .cs-seg span{flex:1;text-align:center;padding:9px;border-radius:9px;font-size:14px;font-weight:600;color:var(--mute);}
  .cs-seg span.on{background:var(--accent);color:#fff;box-shadow:0 3px 8px -3px rgba(79,70,229,.5);}
  .cs-card{background:#f7f8fb;border-radius:15px;padding:15px 15px 16px;}
  .cs-say{font-size:15.5px;font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap;line-height:1.7;color:var(--ink);}
  .cs-pill{display:inline-flex;align-items:center;gap:3px;border:1px solid var(--accent);color:var(--accent);border-radius:999px;padding:3px 10px;font-size:13.5px;font-weight:600;background:#fff;}
  .cs-pill.anim,.cs-dl.anim{animation:pillIn .42s cubic-bezier(.2,.85,.25,1);}
  @keyframes pillIn{0%{opacity:0;transform:translateY(5px) scale(.9);}100%{opacity:1;transform:none;}}
  .cs-card.anim{animation:cardIn .5s cubic-bezier(.2,.85,.25,1);}
  @keyframes cardIn{0%{opacity:0;transform:translateY(12px) scale(.98);}100%{opacity:1;transform:none;}}
  .cs-input{margin-top:11px;background:#fff;border:1px solid var(--line-2);border-radius:11px;padding:12px 12px;font-size:14.5px;color:var(--ink);height:44px;font-weight:400;white-space:nowrap;overflow:hidden;display:flex;align-items:center;}
  .cs-input .ph{color:var(--faint);}
  .caret{display:inline-block;width:2px;height:1.02em;background:var(--accent);vertical-align:-2px;margin-left:1px;animation:blink 1.1s steps(1) infinite;}
  @keyframes blink{50%{opacity:0;}}
  .cs-dl-row{display:flex;align-items:center;gap:10px;margin-top:13px;}
  .cs-dl-lbl{font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--faint);text-transform:uppercase;}
  .cs-dl{border:1px solid var(--accent);color:var(--accent);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;background:#fff;}
  .cs-map{margin-top:12px;border-radius:11px;overflow:hidden;height:104px;position:relative;border:1px solid var(--line);}
  .cs-map svg.map{width:100%;height:100%;display:block;}
  .cs-map .pin{position:absolute;left:50%;top:44%;transform:translate(-50%,-92%);z-index:3;filter:drop-shadow(0 3px 4px rgba(0,0,0,.28));}
  .cs-map .place{position:absolute;left:8px;bottom:8px;background:#fff;color:var(--accent);font-size:11px;font-weight:600;padding:4px 9px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.12);z-index:3;}
  .cs-ideas-h{font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--faint);text-transform:uppercase;margin:15px 0 9px;}
  .cs-ideas{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
  .cs-idea{display:flex;align-items:center;gap:9px;background:#f7f8fb;border-radius:11px;padding:11px 12px;font-size:13px;font-weight:500;color:var(--ink);}
  .cs-idea .ic{width:22px;height:22px;border-radius:6px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;color:var(--accent);flex:none;}
  .cs-idea .ic svg{width:13px;height:13px;}
  .cs-create{margin-top:auto;background:var(--accent);color:#fff;border-radius:12px;text-align:center;font-weight:600;font-size:15px;padding:14px;}

  /* ---------- how it works ---------- */
  .pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:26px;justify-content:center;}
  .pill{border:1px solid var(--line-2);background:#fff;color:var(--mute);border-radius:999px;padding:9px 18px;font:inherit;font-weight:600;font-size:14px;cursor:pointer;transition:all .15s;letter-spacing:-.01em;}
  .pill:hover{border-color:var(--ink);color:var(--ink);}
  .pill.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .how-grid{display:grid;grid-template-columns:1fr 360px;gap:60px;margin-top:40px;align-items:center;}
  .how-left{display:flex;flex-direction:column;}
  .step{display:flex;gap:16px;opacity:.4;transition:opacity .3s;}
  .step.on{opacity:1;}
  .step .rail{display:flex;flex-direction:column;align-items:center;flex:none;}
  .step .dot{width:32px;height:32px;border-radius:16px;background:#fff;border:1px solid var(--line-2);color:var(--faint);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;transition:all .3s;}
  .step.on .dot{background:var(--ink);border-color:var(--ink);color:#fff;}
  .step .conn{width:1.5px;flex:1;background:var(--line-2);margin:5px 0;min-height:24px;transition:background .3s;}
  .step.done .conn{background:var(--ink);}
  .step .body{padding-bottom:24px;}
  .step h4{font-size:18px;font-weight:640;margin-bottom:5px;letter-spacing:-.02em;}
  .step p{margin:0;color:var(--mute);font-size:14.5px;line-height:1.55;}
  .step .bar{height:2px;border-radius:2px;background:var(--line-2);margin-top:14px;overflow:hidden;display:none;}
  .step.on .bar{display:block;}
  .step .bar i{display:block;height:2px;background:var(--accent);width:0%;}
  .how-phone{display:flex;justify-content:center;}

  /* ---------- pricing (Anthropic-style cards) ---------- */
  .price-toggle{display:inline-flex;background:#fff;border:1px solid var(--line-2);border-radius:999px;padding:4px;gap:2px;margin-top:26px;}
  .price-toggle button{border:none;background:none;border-radius:999px;padding:8px 18px;font:inherit;font-weight:600;font-size:13.5px;color:var(--mute);cursor:pointer;transition:all .2s;letter-spacing:-.01em;}
  .price-toggle button.on{background:var(--ink);color:#fff;}
  .plans{display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:800px;margin:34px auto 0;text-align:left;}
  .plan{border:1px solid var(--line);border-radius:18px;padding:30px 28px;background:#fff;display:flex;flex-direction:column;}
  .plan.featured{border:1.5px solid var(--accent);background:linear-gradient(180deg,#f6f5ff 0%,#fff 58%);box-shadow:0 28px 60px -38px rgba(79,70,229,.75);}
  .plan-name{font-size:14.5px;font-weight:600;letter-spacing:.01em;display:flex;align-items:center;gap:10px;color:var(--mute);}
  .plan.featured .plan-name{color:var(--accent-deep);}
  .plan.featured .plan-name span:first-child,.plan.featured .plan-price{color:var(--accent-deep);}
  .badge{font-size:11px;font-weight:600;color:#fff;background:var(--accent);border-radius:999px;padding:2px 9px;letter-spacing:0;}
  .plan-price{font-size:46px;font-weight:680;letter-spacing:-.035em;margin:14px 0 0;line-height:1;}
  .plan-per{font-size:15px;font-weight:500;color:var(--mute);letter-spacing:-.01em;}
  .plan-desc{font-size:14px;color:var(--mute);margin:10px 0 0;line-height:1.5;min-height:40px;}
  .plan-cta{margin:22px 0 24px;text-align:center;border-radius:11px;padding:12px;font-weight:600;font-size:14.5px;transition:opacity .15s,transform .15s;letter-spacing:-.01em;}
  .plan-cta:hover{transform:translateY(-1px);}
  .plan-cta.dark{background:var(--ink);color:#fff;}
  .plan.featured .plan-cta.dark{background:var(--accent);color:#fff;box-shadow:0 12px 22px -16px rgba(79,70,229,.9);}
  .plan-cta.ghost{border:1px solid var(--line-2);color:var(--ink);}
  .plan-feats-h{font-size:12.5px;font-weight:600;color:var(--ink);margin-bottom:15px;padding-top:22px;border-top:1px solid var(--line);}
  .plan ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:13px;}
  .plan li{display:flex;gap:10px;font-size:14px;color:var(--mute);line-height:1.4;}
  .plan li svg{width:16px;height:16px;color:var(--accent);flex:none;margin-top:2px;}
  .plan.featured li svg{color:var(--accent-deep);}
  .price-note{font-size:13px;color:var(--faint);font-weight:400;margin-top:18px;}

  @media(max-width:900px){
    .grid3{grid-template-columns:1fr;}.grid2{grid-template-columns:1fr;gap:34px;}
    .hero-flex{flex-direction:column;text-align:center;}.hero-flex .chips,.hero-flex .hero-cta{justify-content:center;}
    .how-grid{grid-template-columns:1fr;gap:28px;}.how-phone{order:-1;}
    .plans{grid-template-columns:1fr;max-width:420px;}
  }
  @media(max-width:560px){header .wrap{padding:0 14px;}.navlink.hide-sm{display:none;}.store small{display:none;}.store b{font-size:14px;}.store.mini{padding:7px 9px;}.store.mini b{font-size:12.5px;}.lang-btn{padding:5px 6px;}}
  @media(max-width:380px){.store.mini{width:34px;height:34px;padding:0;justify-content:center;}.store.mini b{display:none;}.store.mini svg{width:14px;height:16px;}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important;}.caret{animation:blink 1.1s steps(1) infinite!important;}}
</style>
</head>
<body>

<!-- NAV -->
<header style="position:sticky;top:0;z-index:50;background:rgba(255,255,255,.8);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);">
  <div class="wrap" style="display:flex;align-items:center;height:64px;">
    <div style="flex:1;">
      <a href="#top" style="display:inline-flex;align-items:center;gap:8px;">
        <img src="assets/logo-mark.png" alt="Cert" style="width:28px;height:28px;">
        <span style="font-weight:680;font-size:18px;letter-spacing:-.01em;">Cert</span>
      </a>
    </div>
    <nav style="display:flex;gap:26px;align-items:center;">
      <a class="navlink hide-sm" href="#how" data-k="navHow"></a>
      <a class="navlink hide-sm" href="#features" data-k="navFeatures"></a>
      <a class="navlink hide-sm" href="#faq">FAQ</a>
      <a class="navlink hide-sm" href="#pricing" data-k="navPricing"></a>
    </nav>
    <div style="flex:1;display:flex;justify-content:flex-end;align-items:center;gap:14px;">
      <a class="store mini" href="https://apps.apple.com/app/id6786159294" target="_blank" rel="noopener">
        <svg width="15" height="17" viewBox="0 0 15 17" fill="currentColor"><path d="M12.4 9c0-2 1.6-3 1.7-3-1-1.4-2.4-1.6-2.9-1.6-1.2-.1-2.4.7-3 .7-.7 0-1.6-.7-2.7-.7C4.1 4.5 2.8 5.3 2 6.6c-1.5 2.6-.4 6.4 1.1 8.5.7 1 1.5 2.2 2.6 2.1 1.1 0 1.5-.7 2.8-.7s1.6.7 2.8.7c1.1 0 1.9-1 2.6-2.1.8-1.2 1.1-2.4 1.2-2.4-.1 0-2.7-1-2.7-3.7zM10.4 2.8c.6-.7 1-1.7.9-2.8-.9 0-1.9.6-2.5 1.3-.6.6-1 1.6-.9 2.6 1 .1 1.9-.5 2.5-1.1z"/></svg>
        <span><small data-k="storeSmall">Download on the</small><b>App Store</b></span>
      </a>
      <div style="display:flex;gap:2px;">
        <button id="lang-en" class="lang-btn active" onclick="setLang('en')">EN</button>
        <button id="lang-ru" class="lang-btn" onclick="setLang('ru')">RU</button>
      </div>
    </div>
  </div>
</header>

<!-- HERO -->
<section id="top" style="padding:74px 0 66px;">
  <div class="wrap hero-flex" style="display:flex;align-items:center;gap:64px;">
    <div style="flex:1;min-width:0;">
      <span class="live"><span class="dot"></span><span id="liveText"></span></span>
      <h1 style="margin-top:20px;"><span data-k="heroH1a"></span> <span style="color:var(--accent);" data-k="heroH1b"></span></h1>
      <p class="lead" style="margin:22px 0 30px;max-width:480px;" data-k="heroSub"></p>
      <div class="hero-cta" style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;">
        <a class="store lg" href="https://apps.apple.com/app/id6786159294" target="_blank" rel="noopener">
          <svg width="20" height="22" viewBox="0 0 15 17" fill="currentColor"><path d="M12.4 9c0-2 1.6-3 1.7-3-1-1.4-2.4-1.6-2.9-1.6-1.2-.1-2.4.7-3 .7-.7 0-1.6-.7-2.7-.7C4.1 4.5 2.8 5.3 2 6.6c-1.5 2.6-.4 6.4 1.1 8.5.7 1 1.5 2.2 2.6 2.1 1.1 0 1.5-.7 2.8-.7s1.6.7 2.8.7c1.1 0 1.9-1 2.6-2.1.8-1.2 1.1-2.4 1.2-2.4-.1 0-2.7-1-2.7-3.7zM10.4 2.8c.6-.7 1-1.7.9-2.8-.9 0-1.9.6-2.5 1.3-.6.6-1 1.6-.9 2.6 1 .1 1.9-.5 2.5-1.1z"/></svg>
          <span><small data-k="storeSmall"></small><b>App Store</b></span>
        </a>
        <a class="store lg soon" href="#" onclick="return false;" style="cursor:default;">
          <svg width="17" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="M3 2.5v19l10.5-9.5L3 2.5zm12 8.2l3.1-2.8-11-6.2 7.9 9zm0 2.6l-7.9 9 11-6.2-3.1-2.8z"/></svg>
          <span><small data-k="soonSmall"></small><b data-k="soonB"></b></span>

// ---- live create-screen animation (Forfeit-style: the proof pill cycles + the goal types out) ----
const PT=["photo","video","geo"];
let heroVis=true, howVis=true;
// each proof type has several example goals; rotate through them so the animation
// isn't the same sentence every loop (geo stays the gym check-in — it's the strong one).
const gPos={photo:0,video:0,geo:0};
function goalOf(pt){ const a=T[lang].proofs[pt].goals; return a[gPos[pt]%a.length]; }
function advanceGoal(pt){ gPos[pt]++; }
const CHEV='<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" style="margin-left:2px;"><path d="M6 9l6 6 6-6"/></svg>';
function createScreen(pt, typed, flash){
  const d=T[lang], p=d.proofs[pt], geo=pt==="geo", a=flash?' anim':'';
  const pill='<span class="cs-pill'+a+'">'+p.pill+CHEV+'</span>';
  const say = geo
    ? '<div class="cs-say">'+d.csSay+' '+pill+' '+(lang==="ru"?"в":"at")+' <span class="cs-pill'+a+'">'+p.place+CHEV+'</span></div>'
    : '<div class="cs-say">'+d.csSay+' '+pill+' :</div>';
  const input='<div class="cs-input">'+(typed?'<span>'+typed+'</span>':'')+'<span class="caret"></span></div>';
  const dl='<div class="cs-dl-row"><span class="cs-dl-lbl">'+(lang==="ru"?"Дедлайн":"Deadline")+'</span><span class="cs-dl'+a+'">'+p.dl+CHEV+'</span></div>';
  const map = geo ? '<div class="cs-map">'+MAP_SVG+'<div class="pin">'+PIN_SVG+'</div><span class="place">'+p.place+'</span></div>' : '';
  return '<div class="cs-back">‹ '+(lang==="ru"?"Назад":"Back")+'</div>'
    +'<div class="cs-title">'+d.csTitle+'</div>'
    +'<div class="cs-seg"><span class="on">'+d.csOne+'</span><span>'+d.csRep+'</span></div>'
    +'<div class="cs-card'+a+'">'+say+input+dl+map+'</div>'
    +'<div class="cs-create">'+d.csCreate+'</div>';
}
function setInputText(id, typed){ const el=document.getElementById(id); if(!el) return; const inp=el.querySelector('.cs-input'); if(inp) inp.innerHTML=(typed?'<span>'+typed+'</span>':'')+'<span class="caret"></span>'; }

// ---- hero: cycle proof type + typewriter ----
let hIdx=0, hTyped="", hPhase="type", hTick=0;
function renderHero(flash){ const el=document.getElementById("heroScreen"); if(el) el.innerHTML=createScreen(PT[hIdx], hTyped, flash); }
function heroLoop(){ if(!heroVis) return; const full=goalOf(PT[hIdx]);
  if(hPhase==="type"){ if(hTyped.length<full.length){ hTyped=full.slice(0,hTyped.length+1); setInputText("heroScreen", hTyped); } else { hPhase="hold"; hTick=0; } }
  else if(hPhase==="hold"){ hTick++; if(hTick>30) hPhase="next"; }
  else { advanceGoal(PT[hIdx]); hIdx=(hIdx+1)%PT.length; hTyped=""; hPhase="type"; renderHero(true); }
}
setInterval(heroLoop,55);
let liveMsgIdx=0, liveMsgStart=Date.now();
setInterval(()=>{ if(!heroVis) return;
  if(Math.floor((Date.now()-liveMsgStart)/1000)>=13){ liveMsgIdx=(liveMsgIdx+1)%T[lang].liveMsgs.length; liveMsgStart=Date.now(); }
  const el=document.getElementById("liveText"); if(el) el.textContent=T[lang].liveText(T[lang].liveMsgs[liveMsgIdx], Math.floor((Date.now()-liveMsgStart)/1000));
},1000);

// ---- how-it-works: pills + steps + typewriter ----
let cat=0, step=0, prog=0, raf=null, lastT=0, cTyped="", cTw=null;
const STEP_MS=2700; const HOWCATS=PT;
function howD(){ return T[lang].how[HOWCATS[cat]]; }
function startHowType(){ clearInterval(cTw); cTyped=""; const full=goalOf(HOWCATS[cat]); let i=0; cTw=setInterval(()=>{ i++; cTyped=full.slice(0,i); setInputText("howScreen", cTyped); if(i>=full.length) clearInterval(cTw); },48); }
function renderHowPhone(){ const el=document.getElementById("howScreen"); if(el) el.innerHTML=createScreen(HOWCATS[cat], cTyped, step===0); }
function renderPills(){ const el=document.getElementById("howPills"); el.innerHTML=""; HOWCATS.forEach((c,i)=>{ const b=document.createElement("button"); b.className="pill"+(i===cat?" active":""); b.textContent=T[lang].how[c].label; b.onclick=()=>{ cat=i; step=0; prog=0; lastT=0; startHowType(); renderAll(); }; el.appendChild(b); }); }
function renderSteps(){ const el=document.getElementById("howSteps"), d=howD(); el.innerHTML=""; d.steps.forEach((s,i)=>{ const div=document.createElement("div"); div.className="step"+(i===step?" on":"")+(i<step?" done":""); const conn=i<d.steps.length-1?'<div class="conn"></div>':''; div.innerHTML='<div class="rail"><div class="dot">'+(i+1)+'</div>'+conn+'</div><div class="body"><h4>'+s[0]+'</h4><p>'+s[1]+'</p><div class="bar"><i style="width:'+(i===step?Math.round(prog*100):0)+'%"></i></div></div>'; el.appendChild(div); }); }
function renderAll(){ renderPills(); renderSteps(); renderHowPhone(); }
function frame(t){ if(howVis){ if(!lastT) lastT=t; prog+=(t-lastT)/STEP_MS; lastT=t; if(prog>=1){ prog=0; step++; if(step>2){ step=0; advanceGoal(HOWCATS[cat]); cat=(cat+1)%HOWCATS.length; startHowType(); } renderAll(); } else { const bar=document.querySelector("#howSteps .step.on .bar i"); if(bar) bar.style.width=Math.round(prog*100)+"%"; } } else { lastT=0; } raf=requestAnimationFrame(frame); }
try{ const io=new IntersectionObserver((es)=>{ es.forEach(e=>{ if(e.target.id==="top") heroVis=e.isIntersecting; if(e.target.id==="how") howVis=e.isIntersecting; }); },{threshold:0}); io.observe(document.getElementById("top")); io.observe(document.getElementById("how")); }catch(_){}
