<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cert — The Streak You Can't Fake</title>
<meta name="description" content="Set one goal. Send live proof every day — a photo, a video, or a location check-in. An AI judge decides if it counts. Free on the App Store.">
<meta property="og:title" content="Cert — The Streak You Can't Fake">
<meta property="og:description" content="One goal. Live proof every day. An AI judge decides if it counts. Free on the App Store.">
<meta property="og:type" content="website">
<link rel="icon" type="image/png" href="assets/logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#4f46e5; --accent-deep:#4338ca; --accent-soft:#eef2ff;
    --ink:#0e1116; --mute:#5b6472; --faint:#98a1ae;
    --bg:#ffffff; --card:#f6f8fb; --line:#e7eaf1;
    --dark:#12102b; --dark2:#1e1b4e; --dark-ink:#f2f0ff; --dark-mute:#b9beF8;
    --err:#dc2626; --ok:#16a34a; --black:#0e1116;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  html,body{margin:0;padding:0;background:var(--bg);}
  body{font-family:'Inter',-apple-system,sans-serif;color:var(--ink);overflow-x:hidden;-webkit-font-smoothing:antialiased;}
  ::selection{background:var(--accent);color:#fff;}
  a{color:inherit;}
  .wrap{max-width:1140px;margin:0 auto;padding:0 24px;}
  h1,h2,h3,h4{margin:0;font-weight:900;letter-spacing:-.03em;line-height:1.02;}
  h1{font-size:clamp(46px,7vw,84px);}
  h2{font-size:clamp(32px,4.6vw,52px);}
  .lead{font-size:clamp(18px,2vw,21px);line-height:1.55;color:var(--mute);}
  .sub{font-size:17px;line-height:1.6;color:var(--mute);}
  .kicker{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px;}
  .chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:9px 15px;font-size:13.5px;font-weight:600;color:var(--mute);background:#fff;}
  .chip svg{width:15px;height:15px;color:var(--accent);flex:none;}
  .icon-box{width:46px;height:46px;border-radius:13px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;color:var(--accent);flex:none;}
  .icon-box svg{width:22px;height:22px;}
  /* black store buttons — Forfeit style */
  .store{display:inline-flex;align-items:center;gap:9px;background:var(--black);color:#fff;border-radius:12px;padding:10px 18px;text-decoration:none;transition:transform .15s,opacity .15s;}
  .store:hover{transform:translateY(-1px);opacity:.9;}
  .store small{display:block;font-size:10px;font-weight:600;opacity:.8;letter-spacing:.02em;line-height:1;}
  .store b{display:block;font-size:16px;font-weight:800;line-height:1.15;}
  .store.lg{padding:13px 22px;}
  .store.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);}
  .btn{display:inline-flex;align-items:center;gap:9px;background:var(--accent);color:#fff;border:none;border-radius:12px;padding:14px 24px;font:inherit;font-weight:700;font-size:16px;text-decoration:none;cursor:pointer;transition:transform .15s,box-shadow .15s;}
  .btn:hover{transform:translateY(-1px);box-shadow:0 10px 30px rgba(79,70,229,.28);}
  .btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);}
  .btn.ghost:hover{border-color:var(--accent);color:var(--accent);box-shadow:none;}
  .navlink{text-decoration:none;font-size:14px;font-weight:600;color:var(--mute);}
  .navlink:hover{color:var(--accent);}
  .lang-btn{background:none;border:none;padding:5px 8px;font:inherit;font-size:12px;font-weight:700;color:var(--faint);cursor:pointer;border-radius:7px;}
  .lang-btn.active{background:var(--accent);color:#fff;}
  .live{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;color:var(--mute);}
  .live .dot{width:8px;height:8px;border-radius:5px;background:var(--accent);animation:pulse 1.6s ease infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
  .acc-q{width:100%;text-align:left;background:none;border:none;padding:20px 0;font:inherit;font-size:17px;font-weight:700;color:var(--ink);cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:14px;}
  .acc-q:hover{color:var(--accent);}
  .acc-a{display:none;padding:0 0 20px;color:var(--mute);font-size:15.5px;line-height:1.65;}
  .acc-item{border-bottom:1px solid var(--line);}
  .acc-item.open .acc-a{display:block;}
  .acc-item.open .acc-x{transform:rotate(45deg);}
  .acc-x{transition:transform .15s;color:var(--accent);font-size:22px;font-weight:700;flex:none;}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:22px;}
  .pro-tag{font-size:11px;font-weight:900;color:var(--accent);border:1.5px solid var(--accent);border-radius:6px;padding:2px 6px;vertical-align:middle;letter-spacing:.04em;}
  /* phone */
  .phone{width:320px;border:12px solid #0e1116;border-radius:48px;background:#fff;box-shadow:0 40px 90px rgba(14,17,22,.20);overflow:hidden;flex:none;}
  .phone.real{line-height:0;background:#0e1116;}
  .phone.real .shot{width:100%;display:block;}
  .pnotch{height:30px;display:flex;justify-content:center;align-items:center;background:#fff;padding-top:8px;}
  .pnotch i{width:110px;height:22px;background:#0e1116;border-radius:14px;}
  .pscreen{padding:14px 14px 20px;background:#fff;}
  /* create-screen mock (animated) */
  .cs-title{font-size:22px;font-weight:900;margin:2px 0 12px;}
  .cs-toggle{display:flex;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:4px;gap:4px;}
  .cs-toggle span{flex:1;text-align:center;padding:9px;border-radius:10px;font-size:13.5px;font-weight:800;color:var(--mute);}
  .cs-toggle span.on{background:var(--accent);color:#fff;}
  .cs-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin-top:12px;}
  .cs-say{font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .cs-pill{display:inline-flex;align-items:center;gap:5px;border:1.5px solid var(--accent);color:var(--accent);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:800;transition:transform .25s ease, background .25s;}
  .cs-pill.flash{transform:scale(1.08);background:var(--accent-soft);}
  .cs-input{margin-top:11px;border:1.5px solid var(--accent);border-radius:12px;padding:12px 13px;font-size:14.5px;font-weight:600;min-height:46px;color:var(--ink);}
  .cs-input .ph{color:var(--faint);}
  .cs-deadline{display:flex;align-items:center;gap:10px;margin-top:13px;}
  .cs-deadline .lbl{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--faint);text-transform:uppercase;}
  .cs-dl{border:1.5px solid var(--accent);color:var(--accent);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:800;}
  .cs-map{margin-top:11px;height:96px;border-radius:12px;background:linear-gradient(135deg,#e8ecf6,#dfe4f5);position:relative;overflow:hidden;}
  .cs-map .pin{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:16px;height:16px;border-radius:50% 50% 50% 0;background:var(--err);rotate:-45deg;}
  .cs-ideas-h{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--faint);text-transform:uppercase;margin:14px 0 8px;}
  .cs-ideas{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .cs-idea{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:9px;font-size:12.5px;font-weight:700;}
  .cs-idea .ic{width:24px;height:24px;border-radius:7px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;color:var(--accent);flex:none;}
  .cs-idea .ic svg{width:14px;height:14px;}
  .cs-create{margin-top:14px;background:var(--accent);color:#fff;border-radius:12px;text-align:center;font-weight:800;font-size:15px;padding:13px;}
  .caret{display:inline-block;width:2px;height:1.05em;background:var(--accent);vertical-align:-3px;animation:blink 1s steps(1) infinite;}
  @keyframes blink{50%{opacity:0;}}
  /* interactive how-it-works */
  .pills{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px;}
  .pill{border:1.5px solid var(--line);background:#fff;color:var(--mute);border-radius:999px;padding:10px 18px;font:inherit;font-weight:800;font-size:14px;cursor:pointer;transition:all .15s;}
  .pill:hover{border-color:var(--accent);color:var(--accent);}
  .pill.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .how-grid{display:grid;grid-template-columns:1fr 360px;gap:52px;margin-top:40px;align-items:start;}
  .step{display:flex;gap:16px;opacity:.45;transition:opacity .3s;}
  .step.on{opacity:1;}
  .step .rail{display:flex;flex-direction:column;align-items:center;flex:none;}
  .step .dot{width:34px;height:34px;border-radius:17px;background:var(--card);border:1.5px solid var(--line);color:var(--faint);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;transition:all .3s;}
  .step.on .dot{background:var(--accent);border-color:var(--accent);color:#fff;}
  .step .conn{width:2px;flex:1;background:var(--line);margin:4px 0;min-height:26px;transition:background .3s;}
  .step.done .conn{background:var(--accent);}
  .step .body{padding-bottom:22px;}
  .step h4{font-size:19px;margin-bottom:6px;}
  .step p{margin:0;color:var(--mute);font-size:15px;line-height:1.55;}
  .step .bar{height:3px;border-radius:2px;background:var(--line);margin-top:14px;overflow:hidden;display:none;}
  .step.on .bar{display:block;}
  .step .bar i{display:block;height:3px;background:var(--accent);width:0%;}
  .how-phone{position:sticky;top:90px;display:flex;justify-content:center;}
  .stat-num{font-size:clamp(30px,4vw,44px);font-weight:900;letter-spacing:-.03em;color:var(--ink);}
  .price-toggle{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px;gap:4px;margin-top:24px;}
  .price-toggle button{border:none;background:none;border-radius:999px;padding:9px 20px;font:inherit;font-weight:800;font-size:14px;color:var(--mute);cursor:pointer;transition:all .2s;}
  .price-toggle button.on{background:var(--accent);color:#fff;}
  .price-amt{font-size:44px;font-weight:900;letter-spacing:-.03em;}
  .price-amt .per{font-size:16px;font-weight:700;color:var(--mute);}
  @media(max-width:900px){
    .grid3{grid-template-columns:1fr;}.grid2{grid-template-columns:1fr;}
    .hero-flex{flex-direction:column;text-align:center;}.hero-flex .chips,.hero-flex .hero-cta{justify-content:center;}
    .how-grid{grid-template-columns:1fr;gap:14px;}.how-phone{position:static;order:-1;margin-bottom:8px;}
  }
  @media(max-width:560px){.navlink.hide-sm{display:none;}.store small{display:none;}.store b{font-size:14px;}}
</style>
</head>
<body>

<!-- NAV -->
<header style="position:sticky;top:0;z-index:50;background:rgba(255,255,255,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);">
  <div class="wrap" style="display:flex;align-items:center;gap:22px;height:66px;">
    <a href="#top" style="display:flex;align-items:center;gap:9px;text-decoration:none;">
      <img src="assets/logo-mark.png" alt="Cert" style="width:30px;height:30px;">
      <span style="font-weight:900;font-size:19px;letter-spacing:.04em;">CERT</span>
    </a>
    <nav style="display:flex;gap:22px;margin-left:auto;align-items:center;">
      <a class="navlink hide-sm" href="#how" data-k="navHow"></a>
      <a class="navlink hide-sm" href="#flex" data-k="navFeatures"></a>

      <a class="navlink hide-sm" href="#pricing" data-k="navPricing"></a>

        <svg width="18" height="20" viewBox="0 0 15 17" fill="currentColor"><path d="M12.4 9c0-2 1.6-3 1.7-3-1-1.4-2.4-1.6-2.9-1.6-1.2-.1-2.4.7-3 .7-.7 0-1.6-.7-2.7-.7C4.1 4.5 2.8 5.3 2 6.6c-1.5 2.6-.4 6.4 1.1 8.5.7 1 1.5 2.2 2.6 2.1 1.1 0 1.5-.7 2.8-.7s1.6.7 2.8.7c1.1 0 1.9-1 2.6-2.1.8-1.2 1.1-2.4 1.2-2.4-.1 0-2.7-1-2.7-3.7zM10.4 2.8c.6-.7 1-1.7.9-2.8-.9 0-1.9.6-2.5 1.3-.6.6-1 1.6-.9 2.6 1 .1 1.9-.5 2.5-1.1z"/></svg>
        <span><small data-k="storeSmall"></small><b>App Store</b></span>

      <div style="display:flex;gap:2px;">
        <button id="lang-en" class="lang-btn active" onclick="setLang('en')">EN</button>
        <button id="lang-ru" class="lang-btn" onclick="setLang('ru')">RU</button>
      </div>
    </nav>
  </div>
</header>

<!-- HERO -->
<section id="top" style="padding:72px 0 60px;">
  <div class="wrap hero-flex" style="display:flex;align-items:center;gap:60px;">
    <div style="flex:1;min-width:0;">
      <span class="live"><span class="dot"></span><span id="liveText"></span></span>
      <h1 style="margin-top:18px;"><span data-k="heroH1a"></span> <span style="color:var(--accent);" data-k="heroH1b"></span></h1>
      <p class="lead" style="margin:24px 0 30px;max-width:500px;" data-k="heroSub"></p>
      <div class="hero-cta" style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;">
        <a class="store lg" href="https://apps.apple.com/app/id6786159294" target="_blank" rel="noopener">
          <svg width="20" height="22" viewBox="0 0 15 17" fill="currentColor"><path d="M12.4 9c0-2 1.6-3 1.7-3-1-1.4-2.4-1.6-2.9-1.6-1.2-.1-2.4.7-3 .7-.7 0-1.6-.7-2.7-.7C4.1 4.5 2.8 5.3 2 6.6c-1.5 2.6-.4 6.4 1.1 8.5.7 1 1.5 2.2 2.6 2.1 1.1 0 1.5-.7 2.8-.7s1.6.7 2.8.7c1.1 0 1.9-1 2.6-2.1.8-1.2 1.1-2.4 1.2-2.4-.1 0-2.7-1-2.7-3.7zM10.4 2.8c.6-.7 1-1.7.9-2.8-.9 0-1.9.6-2.5 1.3-.6.6-1 1.6-.9 2.6 1 .1 1.9-.5 2.5-1.1z"/></svg>
          <span><small data-k="storeSmall"></small><b>App Store</b></span>
        </a>
        <a class="store lg ghost" href="#" onclick="return false;" style="cursor:default;">
          <svg width="18" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3 2.5v19l10.5-9.5L3 2.5zm12 8.2l3.1-2.8-11-6.2 7.9 9zm0 2.6l-7.9 9 11-6.2-3.1-2.8z"/></svg>
          <span><small data-k="soonSmall"></small><b data-k="soonB"></b></span>

      </div>
      <div class="chips" style="display:flex;gap:10px;flex-wrap:wrap;margin-top:28px;">
        <span class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="13" rx="3"/><circle cx="12" cy="13.5" r="3.2"/><path d="M8 7l1.4-2.2h5.2L16 7"/></svg><span data-k="chipLive"></span></span>
        <span class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4"/><path d="M12 3l7 3v5c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/></svg><span data-k="chipAI"></span></span>
        <span class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><path d="M16 5.5a3.2 3.2 0 0 1 0 6M17 19a5.5 5.5 0 0 0-3-4.9"/></svg><span data-k="chipFriends"></span></span>

    </div>
    <div class="phone"><div class="pnotch"><i></i></div><div class="pscreen" id="heroScreen"></div></div>
  </div>
</section>

<!-- HOW IT WORKS (interactive; pills drive the animated create screen) -->
<section id="how" style="padding:78px 0;background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line);">
  <div class="wrap">
    <span class="kicker" data-k="howKicker"></span>
    <h2 style="margin-top:14px;max-width:620px;" data-k="howH"></h2>
    <div class="pills" id="howPills"></div>
    <div class="how-grid">
      <div class="steps" id="howSteps"></div>
      <div class="how-phone"><div class="phone"><div class="pnotch"><i></i></div><div class="pscreen" id="howScreen"></div></div></div>

</section>

<!-- FLEXIBILITY / FEATURES -->
<section id="flex" style="padding:82px 0;">
  <div class="wrap">
    <span class="kicker" data-k="flexKicker"></span>
    <h2 style="margin-top:14px;max-width:600px;" data-k="flexH"></h2>
    <div class="grid3" style="margin-top:40px;">
      <div class="card"><div class="icon-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l7 3v5c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/><path d="M9 12l2 2 4-4"/></svg></div><h4 style="margin:16px 0 6px;font-size:19px;" data-k="f1H"></h4><p style="margin:0;color:var(--mute);font-size:15px;line-height:1.6;" data-k="f1T"></p></div>
      <div class="card"><div class="icon-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12a8 8 0 1 1 3 6.2"/><path d="M4 20v-4h4"/></svg></div><h4 style="margin:16px 0 6px;font-size:19px;" data-k="f2H"></h4><p style="margin:0;color:var(--mute);font-size:15px;line-height:1.6;" data-k="f2T"></p></div>
      <div class="card"><div class="icon-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M4 7l16 10M20 7L4 17M12 4l3 2-3 2-3-2zM12 20l3-2-3-2-3 2z"/></svg></div><h4 style="margin:16px 0 6px;font-size:19px;" data-k="f3H"></h4><p style="margin:0;color:var(--mute);font-size:15px;line-height:1.6;" data-k="f3T"></p></div>
      <div class="card"><div class="icon-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21c5-5 7-8.2 7-11a7 7 0 1 0-14 0c0 2.8 2 6 7 11z"/><circle cx="12" cy="10" r="2.6"/></svg></div><h4 style="margin:16px 0 6px;font-size:19px;" data-k="f4H"></h4><p style="margin:0;color:var(--mute);font-size:15px;line-height:1.6;" data-k="f4T"></p></div>
      <div class="card"><div class="icon-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 15l3-3 2 2 4-5"/></svg></div><h4 style="margin:16px 0 6px;font-size:19px;" data-k="f5H"></h4><p style="margin:0;color:var(--mute);font-size:15px;line-height:1.6;" data-k="f5T"></p></div>
      <div class="card"><div class="icon-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><path d="M16 5.5a3.2 3.2 0 0 1 0 6M17 19a5.5 5.5 0 0 0-3-4.9"/></svg></div><h4 style="margin:16px 0 6px;font-size:19px;" data-k="f6H"></h4><p style="margin:0;color:var(--mute);font-size:15px;line-height:1.6;" data-k="f6T"></p></div>
    </div>
  </div>
</section>

<!-- ANALYTICS SHOWCASE (real screenshot) -->
<section style="padding:78px 0;background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line);">
  <div class="wrap grid2" style="align-items:center;">
    <div class="phone real" style="justify-self:center;"><img class="shot" src="assets/landing/statistics.jpg" alt="Cert — analytics & trophies"></div>
    <div>
      <span class="kicker" data-k="anKicker"></span>
      <h2 style="margin-top:14px;" data-k="anH"></h2>
      <p class="sub" style="margin:20px 0 0;" data-k="anT"></p>

      ["Можно ли обмануть судью?","Пробуют многие. Скриншоты, картинки из интернета, старые фото и fake-GPS отклоняются. Если судья ошибся — есть одна апелляция: повторная, более щадящая проверка."],
      ["Где версия для Android?","В закрытом тестировании в Google Play. iPhone доступен уже сейчас, Android — следующий."]
    ],
    liveText:(s)=>"Онлайн · Цель создана · "+s+" сек назад"
  }
};
let lang = localStorage.getItem("cert_lang") || ((navigator.language||"").toLowerCase().startsWith("ru")?"ru":"en");
const IDEA_ICONS=[
  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8v8M18 8v8M6 12h12M3 10v4M21 10v4"/></svg>',
  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="13" cy="5" r="1.6"/><path d="M6 21l3-5 3 1 2 4M9 16l1-4 4 1 3-2"/></svg>',
  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="1.8"/><path d="M8 21l2-8-3-2 5-2 4 3M12 13l3 8"/></svg>',
  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3v8a3 3 0 0 0 6 0V3M8 3v18M17 3c-1.5 0-2 2-2 4s.5 4 2 4 2-2 2-4-.5-4-2-4zM17 15v6"/></svg>'
];
// ---- animated CREATE screen ----
const PT=["photo","video","geo"];
function createScreen(pt, typed, flash){
  const d=T[lang], p=d.proofs[pt];
  const chev='<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" style="margin-left:2px;"><path d="M6 9l6 6 6-6"/></svg>';
  const pill='<span class="cs-pill'+(flash?' flash':'')+'">'+p.pill+chev+'</span>';
  const say = pt==="geo"
    ? '<div class="cs-say">'+d.csSay+' '+pill+' '+(lang==="ru"?"в":"at")+'</div><div style="margin-top:8px;"><span class="cs-pill">'+p.place+chev+'</span></div>'
    : '<div class="cs-say">'+d.csSay+' '+pill+' :</div>';
  const input='<div class="cs-input">'+(typed?'<span>'+typed+'</span>':'<span class="ph">'+(lang==="ru"?"напр. ":"e.g. ")+p.goal+'</span>')+'<span class="caret"></span></div>';
  const map = pt==="geo" ? '<div class="cs-map"><div class="pin"></div></div>' : '';
  const ideas = d.ideas.map((t,i)=>'<div class="cs-idea"><span class="ic">'+IDEA_ICONS[i]+'</span>'+t+'</div>').join('');
  return '<div class="cs-title">'+d.csTitle+'</div>'
    +'<div class="cs-toggle"><span class="on">'+d.csOne+'</span><span>'+d.csRep+'</span></div>'
    +'<div class="cs-card">'+say+input+map
      +'<div class="cs-deadline"><span class="lbl">'+(lang==="ru"?"Дедлайн":"Deadline")+'</span><span class="cs-dl">'+p.dl+chev+'</span></div></div>'
    +'<div class="cs-ideas-h">'+d.csIdeasH+'</div><div class="cs-ideas">'+ideas+'</div>'
    +'<div class="cs-create">'+d.csCreate+'</div>';
}

// ---- hero animation (auto-cycle proof type + typewriter) ----
let hIdx=0, hTyped="", hPhase="type", hTick=0, hStart=Date.now();
function heroFull(){ return T[lang].proofs[PT[hIdx]].goal; }
function renderHero(flash){ const el=document.getElementById("heroScreen"); if(el) el.innerHTML=createScreen(PT[hIdx], hTyped, flash); }
function heroLoop(){
  const full=heroFull();
  if(hPhase==="type"){ if(hTyped.length<full.length){ hTyped=full.slice(0,hTyped.length+1); renderHero(); } else { hPhase="hold"; hTick=0; } }
  else if(hPhase==="hold"){ hTick++; if(hTick>26){ hPhase="next"; } }
  else { hIdx=(hIdx+1)%PT.length; hTyped=""; hPhase="type"; renderHero(true); setTimeout(()=>renderHero(false),260); }
}
setInterval(heroLoop,55);
setInterval(()=>{ const el=document.getElementById("liveText"); if(el) el.textContent=T[lang].liveText(Math.floor((Date.now()-hStart)/1000)%60); },1000);

// ---- how-it-works (pills + steps + progress drive the SAME create screen) ----
let cat=0, step=0, prog=0, raf=null, lastT=0, cTyped="", cTw=null;
const STEP_MS=2700; const HOWCATS=["photo","video","geo"];
function howD(){ return T[lang].how[HOWCATS[cat]]; }
function startHowType(){ clearInterval(cTw); cTyped=""; const full=T[lang].proofs[HOWCATS[cat]].goal; let i=0; cTw=setInterval(()=>{ i++; cTyped=full.slice(0,i); renderHowPhone(); if(i>=full.length) clearInterval(cTw); },50); }
function renderHowPhone(){ const el=document.getElementById("howScreen"); if(el) el.innerHTML=createScreen(HOWCATS[cat], cTyped, step===0); }
function renderPills(){ const el=document.getElementById("howPills"); el.innerHTML=""; HOWCATS.forEach((c,i)=>{ const b=document.createElement("button"); b.className="pill"+(i===cat?" active":""); b.textContent=T[lang].how[c].label; b.onclick=()=>{ cat=i; step=0; prog=0; lastT=0; startHowType(); renderAll(); }; el.appendChild(b); }); }
function renderSteps(){ const el=document.getElementById("howSteps"), d=howD(); el.innerHTML=""; d.steps.forEach((s,i)=>{ const div=document.createElement("div"); div.className="step"+(i===step?" on":"")+(i<step?" done":""); const conn=i<d.steps.length-1?'<div class="conn"></div>':''; div.innerHTML='<div class="rail"><div class="dot">'+(i+1)+'</div>'+conn+'</div><div class="body"><h4>'+s[0]+'</h4><p>'+s[1]+'</p><div class="bar"><i style="width:'+(i===step?Math.round(prog*100):0)+'%"></i></div></div>'; el.appendChild(div); }); }
function renderAll(){ renderPills(); renderSteps(); renderHowPhone(); }
function frame(t){ if(!lastT) lastT=t; prog+=(t-lastT)/STEP_MS; lastT=t; if(prog>=1){ prog=0; step++; if(step>2){ step=0; cat=(cat+1)%HOWCATS.length; startHowType(); } renderAll(); } else { const bar=document.querySelector(".step.on .bar i"); if(bar) bar.style.width=Math.round(prog*100)+"%"; } raf=requestAnimationFrame(frame); }

// ---- pricing ----
let bill="mo";
function renderPrice(){
  const yr=bill==="yr", d=T[lang];
  const P=window.CertPrice;
  const mo=P?P.monthly():"$4.99", yrp=P?P.yearly():"$29.99", perMo=P?P.yearlyPerMo():"$2.50";
  document.getElementById("proPrice").textContent = yr?yrp:mo;
  document.getElementById("proPer").textContent = yr?(lang==="ru"?"/год":"/year"):(lang==="ru"?"/мес":"/month");
  document.getElementById("proNote").textContent = yr
    ? (lang==="ru"?"≈ "+perMo+"/мес — экономия ~50%":"≈ "+perMo+"/mo — saves ~50%")
    : (lang==="ru"?"Помесячно. Отмена в любой момент.":"Billed monthly. Cancel anytime.");
  document.getElementById("bill-mo").classList.toggle("on",!yr);
  document.getElementById("bill-yr").classList.toggle("on",yr);
}
function setBill(b){ bill=b; renderPrice(); }

// ---- i18n + accordions ----
function buildAcc(id,arr){ const list=document.getElementById(id); list.innerHTML=""; arr.forEach(([q,a])=>{ const it=document.createElement("div"); it.className="acc-item"; it.innerHTML='<button class="acc-q">'+q+'<span class="acc-x">+</span></button><div class="acc-a">'+a+'</div>'; it.querySelector(".acc-q").onclick=()=>it.classList.toggle("open"); list.appendChild(it); }); }
function applyLang(){
  const d=T[lang]; document.documentElement.lang=lang;
  document.querySelectorAll("[data-k]").forEach(el=>{ const v=d[el.getAttribute("data-k")]; if(typeof v==="string") el.innerHTML=v; });
  document.getElementById("lang-en").classList.toggle("active",lang==="en");
  document.getElementById("lang-ru").classList.toggle("active",lang==="ru");
  buildAcc("ucList",d.uc); buildAcc("faqList",d.faq);
  hTyped=""; hPhase="type"; renderHero();
  startHowType(); renderAll(); renderPrice();
}
function setLang(l){ lang=l; localStorage.setItem("cert_lang",l); applyLang(); }
applyLang();
raf=requestAnimationFrame(frame);
if(window.CertPrice) window.CertPrice.load(renderPrice);
</script>
</body>
</html>
