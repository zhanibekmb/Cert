    --bg:#ffffff; --card:#f6f8fa; --line:#e4e8ee;
    --dark:#1e1b4e; --dark-ink:#eef2ff; --dark-mute:#a5b4fc;
    --err:#dc2626; --ok:#16a34a;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  html,body{margin:0;padding:0;background:var(--bg);}
  body{font-family:'Inter',-apple-system,sans-serif;color:var(--ink);overflow-x:hidden;}
  ::selection{background:var(--accent);color:#fff;}
  a{color:inherit;}
  .wrap{max-width:1080px;margin:0 auto;padding:0 24px;}
  .btn{display:inline-flex;align-items:center;gap:9px;background:var(--accent);color:#fff;border:none;border-radius:12px;padding:14px 24px;font:inherit;font-weight:700;font-size:16px;text-decoration:none;cursor:pointer;transition:transform .15s,box-shadow .15s;}

  .btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);}
  .btn.ghost:hover{border-color:var(--accent);color:var(--accent);box-shadow:none;}
  .kicker{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);}
  h1,h2{margin:0;font-weight:800;letter-spacing:-.02em;line-height:1.06;}

  h2{font-size:clamp(28px,4.2vw,44px);}
  .sub{font-size:18px;line-height:1.6;color:var(--mute);}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px;}
  .chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:8px 15px;font-size:13.5px;font-weight:600;color:var(--mute);background:#fff;}
  .num{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:15px;background:var(--accent);color:#fff;font-weight:800;font-size:14px;flex:none;}
  .navlink{text-decoration:none;font-size:14px;font-weight:600;color:var(--mute);}
  .navlink:hover{color:var(--accent);}
  .lang-btn{background:none;border:none;padding:5px 8px;font:inherit;font-size:12px;font-weight:700;color:var(--faint);cursor:pointer;border-radius:7px;}
  .lang-btn.active{background:var(--accent);color:#fff;}
  .faq-q{width:100%;text-align:left;background:none;border:none;padding:18px 0;font:inherit;font-size:16.5px;font-weight:700;color:var(--ink);cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:14px;}
  .faq-q:hover{color:var(--accent);}
  .faq-a{display:none;padding:0 0 18px;color:var(--mute);font-size:15px;line-height:1.65;}
  .faq-item{border-bottom:1px solid var(--line);}

  .faq-item.open .faq-x{transform:rotate(45deg);}
  .faq-x{transition:transform .15s;color:var(--accent);font-size:20px;font-weight:700;flex:none;}

  .rise{animation:rise .7s ease both;}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  @media(max-width:840px){.grid3{grid-template-columns:1fr;}.grid2{grid-template-columns:1fr;}.hero-flex{flex-direction:column;}}
  @media(max-width:560px){.navlink.hide-sm{display:none;}}

  .pcell.fr{background:transparent;border:1.6px solid var(--accent);}

let lang = localStorage.getItem("cert_lang") || ((navigator.language || "").toLowerCase().startsWith("ru") ? "ru" : "en");
function applyLang() {
  const d = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-k]").forEach((el) => {
    const v = d[el.getAttribute("data-k")];
    if (v !== undefined) el.innerHTML = v;
  });
  document.getElementById("lang-en").classList.toggle("active", lang === "en");
  document.getElementById("lang-ru").classList.toggle("active", lang === "ru");
  const list = document.getElementById("faqList");
  list.innerHTML = "";
  d.faq.forEach(([q, a]) => {
    const item = document.createElement("div");
    item.className = "faq-item";
    item.innerHTML = '<button class="faq-q">' + q + '<span class="faq-x">+</span></button><div class="faq-a">' + a + "</div>";
    item.querySelector(".faq-q").onclick = () => item.classList.toggle("open");
    list.appendChild(item);
  });
}
function setLang(l) { lang = l; localStorage.setItem("cert_lang", l); applyLang(); }
applyLang();
