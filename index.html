<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cert — The Streak You Can't Fake</title>
<meta name="description" content="Set one goal. Send live proof every day — a photo, a video, or a location check-in. An AI judge decides if it counts. Free on the App Store.">
<meta property="og:title" content="Cert — The Streak You Can't Fake">
<meta property="og:description" content="One goal. Live proof every day. An AI judge decides if it counts. Free on the App Store.">
<meta property="og:type" content="website">
<link rel="icon" type="image/png" href="assets/logo-mark.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
  :root{
    --accent:#4f46e5; --accent-deep:#4338ca; --accent-soft:#eef2ff;
    --ink:#0f1115; --mute:#5b6472; --faint:#9aa3b0;
    --bg:#ffffff; --card:#f7f8fb; --line:#e7eaf0;
    --dark:#14122e; --dark2:#1e1b4e; --dark-ink:#f2f0ff; --dark-mute:#b7bdf7;
    --err:#dc2626; --ok:#16a34a;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  html,body{margin:0;padding:0;background:var(--bg);}
  body{font-family:'Inter',-apple-system,sans-serif;color:var(--ink);overflow-x:hidden;-webkit-font-smoothing:antialiased;}
  ::selection{background:var(--accent);color:#fff;}
  a{color:inherit;}
  .wrap{max-width:1120px;margin:0 auto;padding:0 24px;}
  .btn{display:inline-flex;align-items:center;gap:9px;background:var(--accent);color:#fff;border:none;border-radius:13px;padding:15px 26px;font:inherit;font-weight:700;font-size:16px;text-decoration:none;cursor:pointer;transition:transform .15s,box-shadow .15s;}
  .btn:hover{transform:translateY(-1px);box-shadow:0 10px 30px rgba(79,70,229,.30);}
  .btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);}
  .btn.ghost:hover{border-color:var(--accent);color:var(--accent);box-shadow:none;}
  .btn.light{background:#fff;color:var(--accent-deep);}
  .kicker{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);}
  h1,h2,h3{margin:0;font-weight:900;letter-spacing:-.025em;line-height:1.03;}
  h1{font-size:clamp(42px,6.6vw,76px);}
  h2{font-size:clamp(30px,4.6vw,50px);}
  .lead{font-size:clamp(18px,2vw,21px);line-height:1.55;color:var(--mute);}
  .sub{font-size:17px;line-height:1.6;color:var(--mute);}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px;}
  .chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:9px 15px;font-size:13.5px;font-weight:600;color:var(--mute);background:#fff;}
  .chip svg{width:15px;height:15px;color:var(--accent);flex:none;}
  .icon-box{width:48px;height:48px;border-radius:13px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;color:var(--accent);}
  .icon-box svg{width:23px;height:23px;}
  .num{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:17px;background:var(--accent);color:#fff;font-weight:800;font-size:15px;flex:none;}
  .navlink{text-decoration:none;font-size:14px;font-weight:600;color:var(--mute);}
  .navlink:hover{color:var(--accent);}
  .lang-btn{background:none;border:none;padding:5px 8px;font:inherit;font-size:12px;font-weight:700;color:var(--faint);cursor:pointer;border-radius:7px;}
  .lang-btn.active{background:var(--accent);color:#fff;}
  .faq-q{width:100%;text-align:left;background:none;border:none;padding:20px 0;font:inherit;font-size:17px;font-weight:700;color:var(--ink);cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:14px;}
  .faq-q:hover{color:var(--accent);}
  .faq-a{display:none;padding:0 0 20px;color:var(--mute);font-size:15.5px;line-height:1.65;}
  .faq-item{border-bottom:1px solid var(--line);}
  .faq-item.open .faq-a{display:block;}
  .faq-item.open .faq-x{transform:rotate(45deg);}
  .faq-x{transition:transform .15s;color:var(--accent);font-size:22px;font-weight:700;flex:none;}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:22px;}
  .eyebrow-row{display:flex;align-items:center;gap:10px;color:var(--faint);font-size:13px;font-weight:600;}
  /* phone frame — holds a CSS mock now; drop a real screenshot <img class="shot"> in to replace */
  .phone{width:300px;border:11px solid #0f1115;border-radius:46px;background:#fff;box-shadow:0 40px 90px rgba(15,17,21,.20);overflow:hidden;flex:none;}
  .phone.big{width:340px;}
  .phone-notch{height:28px;display:flex;justify-content:center;align-items:flex-start;background:#fff;}
  .phone-notch i{width:120px;height:24px;background:#0f1115;border-radius:0 0 16px 16px;}
  .phone .shot{width:100%;display:block;}
  .pcell{width:18px;height:18px;border-radius:5px;background:#e8ecf1;}
  .pcell.on{background:var(--accent);}
  .pcell.fr{background:transparent;border:1.7px solid var(--accent);}
  .stat{font-weight:900;font-size:clamp(30px,4vw,42px);letter-spacing:-.03em;}
  @media(max-width:900px){.grid3{grid-template-columns:1fr;}.grid2{grid-template-columns:1fr;}.hero-flex{flex-direction:column;text-align:center;}.hero-flex .chips{justify-content:center;}.hero-cta{justify-content:center;}}
  @media(max-width:560px){.navlink.hide-sm{display:none;}}
</style>
</head>
<body>

<!-- ===== NAV ===== -->
<header style="position:sticky;top:0;z-index:50;background:rgba(255,255,255,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);">
  <div class="wrap" style="display:flex;align-items:center;gap:22px;height:66px;">
    <a href="#top" style="display:flex;align-items:center;gap:9px;text-decoration:none;">
      <img src="assets/logo-mark.png" alt="Cert" style="width:30px;height:30px;">
      <span style="font-weight:900;font-size:19px;letter-spacing:.04em;">CERT</span>
    </a>
    <nav style="display:flex;gap:22px;margin-left:auto;align-items:center;">
      <a class="navlink hide-sm" href="#how" data-k="navHow"></a>
      <a class="navlink hide-sm" href="#proof" data-k="navProof"></a>
      <a class="navlink hide-sm" href="#faq">FAQ</a>
      <a class="navlink hide-sm" href="pricing.html" data-k="navPricing"></a>
      <a class="btn" style="padding:10px 17px;font-size:14px;" href="https://apps.apple.com/app/id6786159294" target="_blank" rel="noopener">
        <svg width="15" height="17" viewBox="0 0 15 17" fill="currentColor"><path d="M12.4 9c0-2 1.6-3 1.7-3-1-1.4-2.4-1.6-2.9-1.6-1.2-.1-2.4.7-3 .7-.7 0-1.6-.7-2.7-.7C4.1 4.5 2.8 5.3 2 6.6c-1.5 2.6-.4 6.4 1.1 8.5.7 1 1.5 2.2 2.6 2.1 1.1 0 1.5-.7 2.8-.7s1.6.7 2.8.7c1.1 0 1.9-1 2.6-2.1.8-1.2 1.1-2.4 1.2-2.4-.1 0-2.7-1-2.7-3.7zM10.4 2.8c.6-.7 1-1.7.9-2.8-.9 0-1.9.6-2.5 1.3-.6.6-1 1.6-.9 2.6 1 .1 1.9-.5 2.5-1.1z"/></svg>
        App Store
      </a>
      <div style="display:flex;gap:2px;">
        <button id="lang-en" class="lang-btn active" onclick="setLang('en')">EN</button>
        <button id="lang-ru" class="lang-btn" onclick="setLang('ru')">RU</button>
      </div>
    </nav>
  </div>
</header>

<!-- ===== HERO ===== -->
<section id="top" style="padding:80px 0 64px;">
  <div class="wrap hero-flex" style="display:flex;align-items:center;gap:60px;">
    <div style="flex:1;min-width:0;">
      <span class="kicker" data-k="heroKicker"></span>
      <h1 style="margin-top:16px;"><span data-k="heroH1a"></span> <span style="color:var(--accent);" data-k="heroH1b"></span></h1>
      <p class="lead" style="margin:24px 0 32px;max-width:500px;" data-k="heroSub"></p>
      <div class="hero-cta" style="display:flex;gap:14px;flex-wrap:wrap;align-items:center;">
        <a class="btn" href="https://apps.apple.com/app/id6786159294" target="_blank" rel="noopener">
          <svg width="17" height="19" viewBox="0 0 15 17" fill="currentColor"><path d="M12.4 9c0-2 1.6-3 1.7-3-1-1.4-2.4-1.6-2.9-1.6-1.2-.1-2.4.7-3 .7-.7 0-1.6-.7-2.7-.7C4.1 4.5 2.8 5.3 2 6.6c-1.5 2.6-.4 6.4 1.1 8.5.7 1 1.5 2.2 2.6 2.1 1.1 0 1.5-.7 2.8-.7s1.6.7 2.8.7c1.1 0 1.9-1 2.6-2.1.8-1.2 1.1-2.4 1.2-2.4-.1 0-2.7-1-2.7-3.7zM10.4 2.8c.6-.7 1-1.7.9-2.8-.9 0-1.9.6-2.5 1.3-.6.6-1 1.6-.9 2.6 1 .1 1.9-.5 2.5-1.1z"/></svg>
          <span data-k="heroCta"></span>
        </a>
        <span style="font-size:13.5px;color:var(--faint);font-weight:600;" data-k="heroFree"></span>
      </div>
      <div class="chips" style="display:flex;gap:10px;flex-wrap:wrap;margin-top:32px;">
        <span class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="13" rx="3"/><circle cx="12" cy="13.5" r="3.2"/><path d="M8 7l1.4-2.2h5.2L16 7"/></svg><span data-k="chipLive"></span></span>
        <span class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4"/><path d="M12 3l7 3v5c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/></svg><span data-k="chipAI"></span></span>
        <span class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><path d="M16 5.5a3.2 3.2 0 0 1 0 6M17 19a5.5 5.5 0 0 0-3-4.9"/></svg><span data-k="chipFriends"></span></span>
      </div>
    </div>

    <!-- HERO PHONE — CSS mock of the home goal card. To use a real screenshot,
         replace the whole <div style="padding…"> block below with:
         <img class="shot" src="assets/landing/screen-home.png" alt=""> -->
    <div class="phone">
      <div class="phone-notch"><i></i></div>
      <div style="padding:18px 18px 26px;">
        <div style="font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--faint);text-transform:uppercase;" data-k="mockToday"></div>
        <div style="background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:10px;">
          <div style="display:flex;align-items:center;gap:8px;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="var(--accent)"><path d="M12 2c1 3-1.5 4-1.5 7a4.5 4.5 0 0 0 9 0c0-2-1-3.5-1-3.5 2 1.5 3.5 4 3.5 7a8 8 0 1 1-16 0c0-4.5 4-6.5 6-10.5z"/></svg>
            <span style="font-size:30px;font-weight:900;">23</span>
            <span style="font-size:12px;color:var(--mute);font-weight:600;" data-k="mockDays"></span>
          </div>
          <div style="font-weight:700;margin-top:8px;font-size:15px;" data-k="mockGoal"></div>
          <div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:12px;">
            <i class="pcell on"></i><i class="pcell on"></i><i class="pcell on"></i><i class="pcell on"></i><i class="pcell on"></i><i class="pcell fr"></i><i class="pcell on"></i><i class="pcell on"></i><i class="pcell on"></i><i class="pcell on"></i><i class="pcell on"></i><i class="pcell on"></i><i class="pcell"></i><i class="pcell"></i>
          </div>
          <div style="margin-top:14px;background:var(--accent);border-radius:11px;color:#fff;text-align:center;font-weight:700;font-size:13.5px;padding:12px;" data-k="mockBtn"></div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;background:var(--accent-soft);border:1px solid #dfe3ff;border-radius:13px;padding:12px 13px;margin-top:12px;">
          <span style="display:inline-flex;width:20px;height:20px;border-radius:10px;background:var(--accent);color:#fff;align-items:center;justify-content:center;">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><path d="M5 12l4 4 10-10"/></svg>
          </span>
          <span style="font-size:12.5px;font-weight:600;color:var(--accent-deep);" data-k="mockVerdict"></span>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- ===== DEMO / VIDEO BAND ===== -->
<section style="padding:20px 0 76px;">
  <div class="wrap" style="text-align:center;">
    <span class="kicker" data-k="demoKicker"></span>
    <h2 style="margin:14px auto 0;max-width:760px;" data-k="demoH"></h2>
    <p class="sub" style="margin:16px auto 0;max-width:560px;" data-k="demoT"></p>
    <!-- HERO DEMO VIDEO — the money moment: record a proof → the AI "APPROVED"
         stamp fires. Replace the .phone block below with:
         <video class="shot" autoplay muted loop playsinline poster="assets/landing/demo-poster.jpg">
           <source src="assets/landing/demo-approve.mp4" type="video/mp4"></video> -->
    <div style="display:flex;justify-content:center;margin-top:38px;">
      <div class="phone big">
        <div class="phone-notch"><i></i></div>
        <div style="padding:0;background:#0f1115;position:relative;">
          <div style="aspect-ratio:9/17;background:linear-gradient(160deg,#1e1b4e,#4f46e5);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;">
            <div style="transform:rotate(-8deg);border:4px solid #fff;border-radius:16px;padding:16px 28px;box-shadow:0 0 50px rgba(255,255,255,.25);">
              <div style="color:#fff;font-size:30px;font-weight:900;letter-spacing:.1em;">APPROVED ✓</div>
            </div>
            <div style="color:#c7cbff;font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;" data-k="demoTag"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- ===== HOW IT WORKS ===== -->
<section id="how" style="padding:80px 0;background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line);">
  <div class="wrap">
    <div style="text-align:center;">
      <span class="kicker" data-k="howKicker"></span>
      <h2 style="margin:14px auto 0;max-width:640px;" data-k="howH"></h2>
    </div>
    <div class="grid3" style="margin-top:44px;">
      <div class="card" style="background:#fff;">
        <span class="num">1</span>
        <h3 style="margin:16px 0 8px;font-size:20px;" data-k="how1H"></h3>
        <p style="margin:0;color:var(--mute);font-size:15px;line-height:1.6;" data-k="how1T"></p>
        <!-- optional: <img class="shot" style="border-radius:14px;margin-top:16px;border:1px solid var(--line);" src="assets/landing/screen-create.png"> -->
      </div>
      <div class="card" style="background:#fff;">
        <span class="num">2</span>
        <h3 style="margin:16px 0 8px;font-size:20px;" data-k="how2H"></h3>
        <p style="margin:0;color:var(--mute);font-size:15px;line-height:1.6;" data-k="how2T"></p>
        <!-- optional: <img class="shot" ... src="assets/landing/screen-submit.png"> -->
      </div>
      <div class="card" style="background:#fff;">
        <span class="num">3</span>
        <h3 style="margin:16px 0 8px;font-size:20px;" data-k="how3H"></h3>
        <p style="margin:0;color:var(--mute);font-size:15px;line-height:1.6;" data-k="how3T"></p>
        <!-- optional: <img class="shot" ... src="assets/landing/screen-approved.png"> -->
      </div>
    </div>
  </div>
</section>

<!-- ===== PROOF METHODS ===== -->
<section id="proof" style="padding:82px 0;">
  <div class="wrap">
    <span class="kicker" data-k="proofKicker"></span>
    <h2 style="margin-top:14px;" data-k="proofH"></h2>
    <p class="sub" style="margin:16px 0 0;max-width:560px;" data-k="proofSub"></p>
    <div class="grid3" style="margin-top:40px;">
      <div class="card">
        <div class="icon-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="13" rx="3"/><circle cx="12" cy="13.5" r="3.4"/><path d="M8 7l1.4-2.2h5.2L16 7"/></svg></div>
        <h3 style="margin:16px 0 6px;font-size:20px;" data-k="pm1H"></h3>
        <p style="margin:0;color:var(--mute);font-size:15px;line-height:1.6;" data-k="pm1T"></p>
      </div>
      <div class="card">
        <div class="icon-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="13" height="12" rx="3"/><path d="M16 10l5-3v10l-5-3z"/></svg></div>
        <h3 style="margin:16px 0 6px;font-size:20px;"><span data-k="pm2H"></span> <span class="pro-tag">PRO</span></h3>
        <p style="margin:0;color:var(--mute);font-size:15px;line-height:1.6;" data-k="pm2T"></p>
      </div>
      <div class="card">
        <div class="icon-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21c5-5 7-8.2 7-11a7 7 0 1 0-14 0c0 2.8 2 6 7 11z"/><circle cx="12" cy="10" r="2.6"/></svg></div>
        <h3 style="margin:16px 0 6px;font-size:20px;"><span data-k="pm3H"></span> <span class="pro-tag">PRO</span></h3>
        <p style="margin:0;color:var(--mute);font-size:15px;line-height:1.6;" data-k="pm3T"></p>
      </div>
    </div>
  </div>
</section>

<!-- ===== THE JUDGE (deep band) ===== -->
<section style="padding:84px 0;background:linear-gradient(160deg,var(--dark),var(--dark2));">
  <div class="wrap grid2" style="align-items:center;">
    <div>
      <span class="kicker" style="color:var(--dark-mute);" data-k="judgeKicker"></span>
      <h2 style="color:var(--dark-ink);margin-top:14px;" data-k="judgeH"></h2>
      <p style="color:var(--dark-mute);font-size:17px;line-height:1.65;margin:20px 0 0;" data-k="judgeT"></p>
      <ul style="margin:22px 0 0;padding:0;list-style:none;color:var(--dark-ink);font-size:15.5px;line-height:2.15;font-weight:600;">
        <li style="display:flex;gap:10px;align-items:flex-start;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--dark-mute)" stroke-width="2.5" style="margin-top:6px;flex:none;"><path d="M5 12l4 4 10-10"/></svg><span data-k="judgeL1"></span></li>
        <li style="display:flex;gap:10px;align-items:flex-start;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--dark-mute)" stroke-width="2.5" style="margin-top:6px;flex:none;"><path d="M5 12l4 4 10-10"/></svg><span data-k="judgeL2"></span></li>
        <li style="display:flex;gap:10px;align-items:flex-start;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--dark-mute)" stroke-width="2.5" style="margin-top:6px;flex:none;"><path d="M5 12l4 4 10-10"/></svg><span data-k="judgeL3"></span></li>
      </ul>
    </div>
    <div style="display:flex;justify-content:center;">
      <div style="transform:rotate(-7deg);border:4px solid var(--dark-mute);border-radius:18px;padding:24px 38px;box-shadow:0 0 70px rgba(183,189,247,.30);">
        <div style="color:#fff;font-size:36px;font-weight:900;letter-spacing:.1em;">APPROVED ✓</div>
        <div style="color:var(--dark-mute);font-size:13px;font-weight:700;text-align:center;margin-top:8px;letter-spacing:.08em;text-transform:uppercase;" data-k="judgeStampSub"></div>
      </div>
    </div>
  </div>
</section>

<!-- ===== CHALLENGES ===== -->
<section style="padding:82px 0;">
  <div class="wrap grid2" style="align-items:center;">
    <div>
      <span class="kicker" data-k="chKicker"></span>
      <h2 style="margin-top:14px;" data-k="chH"></h2>
      <p class="sub" style="margin:20px 0 0;" data-k="chT"></p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:24px;">
        <span class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 4h8v3a4 4 0 0 1-8 0z"/><path d="M8 5H5v2a3 3 0 0 0 3 3M16 5h3v2a3 3 0 0 1-3 3M9 15h6M10 20h4M12 12v3"/></svg><span data-k="chChip1"></span></span>
        <span class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18M6 6l12 12M18 6L6 18"/></svg><span data-k="chChip2"></span></span>
        <span class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M4 7l16 10M20 7L4 17M12 4l3 2-3 2-3-2zM12 20l3-2-3-2-3 2z"/></svg><span data-k="chChip3"></span></span>
