<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CERT — The Streak You Can't Fake</title>
<meta name="description" content="One goal. A daily photo. An honest AI judge that can't be fooled. Build a streak you can't fake. Free to start.">
<meta property="og:title" content="CERT — The Streak You Can't Fake">
<meta property="og:description" content="One goal. A daily photo. An honest AI judge. Build a streak you can't fake. Free to start.">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tektur:wght@500;700;800&family=JetBrains+Mono:wght@400;500;700&family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:#070608;}
  body{overflow-x:hidden;font-family:'JetBrains Mono',monospace;}
  ::selection{background:#e23b2e;color:#0a0a0b;}
  @keyframes rise{0%{opacity:0;transform:translateY(34px);}100%{opacity:1;transform:translateY(0);}}
  @keyframes bob{0%,100%{transform:translateY(0);opacity:.65;}50%{transform:translateY(7px);opacity:1;}}
  @keyframes flick{0%,100%{opacity:.85;}50%{opacity:1;}}
  .btn-cta{transition:filter .15s,transform .15s;}
  .btn-cta:hover{filter:brightness(1.08);transform:translateY(-1px);}
  .field-input:focus{border-color:#e23b2e!important;box-shadow:0 0 0 3px rgba(226,59,46,.15);}
  .faq-btn:hover{color:#e23b2e!important;}
  .topnav-link:hover{color:#f4efe8!important;}
  @media(max-width:560px){.topnav-link[data-k="navPricing"]{display:none;}}
  .bet-yes:hover{background:#e23b2e!important;color:#120606!important;}
  .bet-no:hover{border-color:#cbc5bd!important;}
  .lang-btn{background:none;border:none;padding:5px 9px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;color:#7d7770;cursor:pointer;}
  .lang-btn.active{background:#e23b2e;color:#120606;}
  /* scroll reveal */
  .reveal{opacity:0;transform:translateY(30px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1);}
  .reveal.in{opacity:1;transform:none;}
  /* how-it-works cards */
  .step-card{transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease;}
  .step-card:hover{transform:translateY(-8px);border-color:#e23b2e!important;box-shadow:0 18px 44px -18px rgba(226,59,46,.55);}
  .step-card:hover .step-num{transform:scale(1.12);text-shadow:0 0 24px rgba(226,59,46,.7);}
  .step-num{display:inline-block;transition:transform .25s ease,text-shadow .25s ease;}
  /* cta glow pulse */
  @keyframes glowpulse{0%,100%{box-shadow:0 0 0 0 rgba(226,59,46,0);}50%{box-shadow:0 0 32px 4px rgba(226,59,46,.45);}}
  .cta-pulse{animation:glowpulse 2.6s ease-in-out infinite;}
  /* shame red glow breathe */
  @keyframes breathe{0%,100%{text-shadow:0 3px 0 #000,0 0 28px rgba(226,59,46,.2);}50%{text-shadow:0 3px 0 #000,0 0 54px rgba(226,59,46,.5);}}
  .breathe{animation:breathe 3.4s ease-in-out infinite;}
  @media (prefers-reduced-motion:reduce){.reveal{opacity:1!important;transform:none!important;}.cta-pulse,.breathe{animation:none!important;}}
</style>
</head>
<body>

<!-- arena canvas -->
<canvas id="arena" style="position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;"></canvas>
<div style="position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse 120% 80% at 50% 42%, transparent 38%, rgba(0,0,0,.6) 100%);"></div>

<!-- top bar -->
<div style="position:fixed;top:0;left:0;right:0;z-index:6;display:flex;justify-content:space-between;align-items:center;padding:16px 26px;pointer-events:none;">
  <a href="#top" style="display:flex;align-items:center;gap:11px;text-decoration:none;pointer-events:auto;">
    <img src="assets/gladiator-logo.png" alt="" style="height:38px;width:38px;image-rendering:pixelated;filter:drop-shadow(0 2px 4px #000);">
    <span style="font-family:'Tektur',sans-serif;font-weight:800;font-size:20px;letter-spacing:.16em;color:#f4efe8;text-shadow:0 2px 6px #000;">CERT</span>
  </a>
  <div style="display:flex;align-items:center;gap:14px;pointer-events:auto;">
    <a href="pricing.html" class="topnav-link" data-k="navPricing" style="font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#9a948d;text-decoration:none;text-shadow:0 2px 6px #000;"></a>
    <a href="#waitlist" class="topnav-link" data-k="navApp" style="font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#e23b2e;text-decoration:none;text-shadow:0 2px 6px #000;"></a>
    <div style="display:flex;border:1px solid #2a2530;">
      <button id="lang-en" class="lang-btn active" onclick="setLang('en')">EN</button>
      <button id="lang-ru" class="lang-btn" onclick="setLang('ru')">RU</button>
    </div>
  </div>
</div>

<main style="position:relative;z-index:2;">

  <!-- HERO -->
  <section id="top" style="position:relative;min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:104px 24px 72px;">
    <div style="max-width:860px;text-align:center;animation:rise 1s ease-out both;">
      <div style="display:flex;flex-direction:column;gap:6px;font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.28em;color:#8a847c;text-transform:uppercase;margin-bottom:30px;">
        <span data-k="day1"></span>
        <span data-k="day2"></span>
        <span data-k="day3" style="color:#c8c2ba;"></span>
      </div>
      <h1 style="margin:0;font-family:'Tektur',sans-serif;font-weight:800;font-size:clamp(44px,9vw,108px);line-height:.93;letter-spacing:-.01em;text-transform:uppercase;color:#f4efe8;text-shadow:0 3px 0 #000,0 0 44px rgba(0,0,0,.85);"><span data-k="heroBig1"></span><br><span data-k="heroBig2"></span></h1>
      <div style="margin-top:18px;font-family:'JetBrains Mono',monospace;font-size:14px;letter-spacing:.32em;text-transform:uppercase;color:#e23b2e;" data-k="heroAlt"></div>
      <p style="margin:28px auto 0;max-width:560px;font-family:'JetBrains Mono',monospace;font-size:16px;line-height:1.7;color:#b8b2ab;text-shadow:0 2px 10px #000;" data-k="heroSub"></p>
      <a href="#waitlist" class="btn-cta cta-pulse" style="display:inline-block;margin-top:34px;background:#e23b2e;color:#120606;font-family:'Tektur',sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:.16em;font-size:15px;padding:16px 36px;text-decoration:none;" data-k="heroCta"></a>
    </div>
    <div style="position:absolute;bottom:24px;left:0;right:0;text-align:center;">
      <div style="font-family:'Press Start 2P',monospace;font-size:9px;letter-spacing:.16em;color:#cfc8bf;text-shadow:0 2px 8px #000;animation:flick 2.4s ease-in-out infinite;" data-k="scrollHint"></div>
      <div style="margin-top:12px;font-family:'JetBrains Mono',monospace;font-size:18px;color:#e23b2e;animation:bob 1.8s ease-in-out infinite;text-shadow:0 2px 8px #000;">▼</div>
    </div>
  </section>

  <!-- HOW IT WORKS -->
  <section style="display:flex;flex-direction:column;justify-content:center;align-items:center;padding:108px 24px;background:linear-gradient(180deg,rgba(7,6,8,.55),rgba(7,6,8,.6));">
    <div style="width:100%;max-width:1120px;">
      <div class="reveal" style="text-align:center;font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.35em;text-transform:uppercase;color:#8a847c;margin-bottom:10px;" data-k="hiwKicker"></div>
      <div class="reveal" data-delay="60" style="text-align:center;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:#e23b2e;margin-bottom:54px;" data-k="hiwAlt"></div>
      <div style="display:flex;flex-wrap:wrap;gap:24px;justify-content:center;align-items:stretch;">
        <div class="step-card reveal" data-delay="0" style="flex:1 1 300px;max-width:360px;padding:42px 36px;border:1px solid #241f29;background:rgba(11,10,15,.6);">
          <div class="step-num" style="font-family:'Tektur',sans-serif;font-weight:800;font-size:58px;color:#e23b2e;line-height:1;">01</div>
          <div style="margin-top:20px;font-family:'Tektur',sans-serif;font-weight:700;font-size:26px;letter-spacing:.05em;text-transform:uppercase;color:#f4efe8;" data-k="s1t"></div>
          <div style="font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#6f6a63;margin:6px 0 16px;" data-k="s1alt"></div>
          <p style="margin:0;font-family:'JetBrains Mono',monospace;font-size:16px;line-height:1.7;color:#9a948d;" data-k="s1d"></p>
        </div>
        <div class="step-card reveal" data-delay="130" style="flex:1 1 300px;max-width:360px;padding:42px 36px;border:1px solid #241f29;background:rgba(11,10,15,.6);">
          <div class="step-num" style="font-family:'Tektur',sans-serif;font-weight:800;font-size:58px;color:#e23b2e;line-height:1;">02</div>
          <div style="margin-top:20px;font-family:'Tektur',sans-serif;font-weight:700;font-size:26px;letter-spacing:.05em;text-transform:uppercase;color:#f4efe8;" data-k="s2t"></div>
          <div style="font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#6f6a63;margin:6px 0 16px;" data-k="s2alt"></div>
          <p style="margin:0;font-family:'JetBrains Mono',monospace;font-size:16px;line-height:1.7;color:#9a948d;" data-k="s2d"></p>
        </div>
        <div class="step-card reveal" data-delay="260" style="flex:1 1 300px;max-width:360px;padding:42px 36px;border:1px solid #3a1c1a;background:rgba(20,9,8,.6);">
          <div class="step-num" style="font-family:'Tektur',sans-serif;font-weight:800;font-size:58px;color:#e23b2e;line-height:1;">03</div>
          <div style="margin-top:20px;font-family:'Tektur',sans-serif;font-weight:700;font-size:26px;letter-spacing:.05em;text-transform:uppercase;color:#f4efe8;" data-k="s3t"></div>
          <div style="font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#6f6a63;margin:6px 0 16px;" data-k="s3alt"></div>
          <p style="margin:0;font-family:'JetBrains Mono',monospace;font-size:16px;line-height:1.7;color:#9a948d;" data-k="s3d"></p>
        </div>
      </div>
    </div>
  </section>

  <!-- STATS -->
  <section style="padding:84px 24px;background:linear-gradient(180deg,rgba(7,6,8,.58),rgba(7,6,8,.6));border-top:1px solid #1c1822;border-bottom:1px solid #1c1822;">
    <div style="max-width:920px;margin:0 auto;display:flex;flex-wrap:wrap;gap:32px;justify-content:space-around;text-align:center;">
      <div class="reveal" data-delay="0" style="flex:1 1 200px;">
        <div data-count="100" style="font-family:'Tektur',sans-serif;font-weight:800;font-size:clamp(40px,6vw,64px);color:#e23b2e;line-height:1;text-shadow:0 3px 0 #000;">0</div>
        <div style="margin-top:12px;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#9a948d;" data-k="stat1l"></div>
      </div>
      <div class="reveal" data-delay="130" style="flex:1 1 200px;">
        <div style="font-family:'Tektur',sans-serif;font-weight:800;font-size:clamp(40px,6vw,64px);color:#e23b2e;line-height:1;text-shadow:0 3px 0 #000;">0</div>
        <div style="margin-top:12px;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#9a948d;" data-k="stat2l"></div>
      </div>
      <div class="reveal" data-delay="260" style="flex:1 1 200px;">
        <div style="font-family:'Tektur',sans-serif;font-weight:800;font-size:clamp(40px,6vw,64px);color:#e23b2e;line-height:1;text-shadow:0 3px 0 #000;">24/7</div>
        <div style="margin-top:12px;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#9a948d;" data-k="stat3l"></div>
      </div>
    </div>
  </section>

  <!-- WALL OF SHAME -->
  <section style="display:flex;flex-direction:column;justify-content:center;align-items:center;padding:84px 24px;background:linear-gradient(180deg,rgba(7,6,8,.6),rgba(20,8,8,.72));">
    <div style="max-width:760px;text-align:center;animation:rise both .9s ease-out;animation-timeline:view();animation-range:entry 0% cover 40%;">
      <h2 class="breathe" style="margin:0;font-family:'Tektur',sans-serif;font-weight:800;font-size:clamp(34px,6.4vw,72px);line-height:1;letter-spacing:-.01em;text-transform:uppercase;color:#f4efe8;text-shadow:0 3px 0 #000,0 0 40px rgba(226,59,46,.25);" data-k="shameH"></h2>
      <div style="margin-top:16px;font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.32em;text-transform:uppercase;color:#e23b2e;" data-k="shameAlt"></div>
      <p style="margin:30px auto 0;max-width:560px;font-family:'JetBrains Mono',monospace;font-size:17px;line-height:1.75;color:#c2bcb4;text-shadow:0 2px 10px #000;"><span data-k="shameBody"></span><span style="color:#e23b2e;" data-k="shameAccent"></span></p>
    </div>
  </section>

  <!-- AI JUDGE -->
  <section style="display:flex;flex-direction:column;justify-content:center;align-items:center;padding:84px 24px;background:linear-gradient(180deg,rgba(7,6,8,.66),rgba(7,6,8,.7));">
    <div style="max-width:760px;text-align:center;animation:rise both .9s ease-out;animation-timeline:view();animation-range:entry 0% cover 40%;">
      <h2 style="margin:0;font-family:'Tektur',sans-serif;font-weight:800;font-size:clamp(32px,6vw,68px);line-height:1.02;letter-spacing:-.01em;text-transform:uppercase;color:#f4efe8;text-shadow:0 3px 0 #000;"><span data-k="judgeH1"></span><br><span data-k="judgeH2"></span></h2>
      <div style="margin-top:16px;font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:#e23b2e;" data-k="judgeAlt"></div>
      <p style="margin:30px auto 0;max-width:560px;font-family:'JetBrains Mono',monospace;font-size:17px;line-height:1.75;color:#b8b2ab;text-shadow:0 2px 10px #000;" data-k="judgeBody"></p>
    </div>
  </section>

  <!-- MANIFESTO -->
  <section style="display:flex;flex-direction:column;justify-content:center;align-items:center;padding:80px 24px;background:linear-gradient(180deg,rgba(20,8,8,.42),rgba(7,6,8,.7));">
    <div style="max-width:880px;text-align:center;animation:rise both .9s ease-out;animation-timeline:view();animation-range:entry 0% cover 40%;">
      <div style="font-family:'Press Start 2P',monospace;font-size:10px;letter-spacing:.08em;color:#e23b2e;margin-bottom:26px;">✶ ✶ ✶</div>
      <div style="font-family:'Tektur',sans-serif;font-weight:800;font-size:clamp(30px,5.4vw,60px);line-height:1.08;letter-spacing:-.01em;color:#f4efe8;text-shadow:0 3px 0 #000;" data-k="manifestoH"></div>
      <p style="margin:26px auto 0;max-width:560px;font-family:'JetBrains Mono',monospace;font-size:16px;line-height:1.75;color:#b8b2ab;" data-k="manifestoSub"></p>
    </div>
  </section>

  <!-- FAQ -->
  <section style="padding:80px 24px;background:linear-gradient(180deg,rgba(7,6,8,.7),rgba(7,6,8,.74));">
    <div style="max-width:760px;margin:0 auto;">
      <div style="text-align:center;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.35em;text-transform:uppercase;color:#8a847c;margin-bottom:6px;" data-k="faqKicker"></div>
      <div style="text-align:center;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:#e23b2e;margin-bottom:36px;" data-k="faqAlt"></div>
      <div id="faqList" style="border-top:1px solid #241f29;"></div>
    </div>
  </section>

  <!-- CTA / WAITLIST -->
  <section id="waitlist" style="display:flex;flex-direction:column;justify-content:center;align-items:center;padding:84px 24px 80px;background:linear-gradient(180deg,rgba(7,6,8,.72),rgba(5,4,6,.92));">
    <div style="width:100%;max-width:560px;text-align:center;animation:rise both .9s ease-out;animation-timeline:view();animation-range:entry 0% cover 36%;">
      <div style="font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.35em;text-transform:uppercase;color:#8a847c;margin-bottom:14px;" data-k="ctaKicker"></div>
      <h2 style="margin:0;font-family:'Tektur',sans-serif;font-weight:800;font-size:clamp(34px,6.6vw,72px);line-height:1;letter-spacing:-.01em;text-transform:uppercase;color:#f4efe8;text-shadow:0 3px 0 #000;"><span data-k="ctaH1"></span><br><span data-k="ctaH2"></span></h2>
      <div id="seatsLine" style="margin-top:16px;font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:#e23b2e;"></div>
      <p style="margin:22px auto 30px;max-width:440px;font-family:'JetBrains Mono',monospace;font-size:15px;line-height:1.7;color:#9a948d;" data-k="ctaSub"></p>

      <div style="border:1px solid #2a2530;background:rgba(10,9,13,.78);padding:26px;text-align:left;">

        <!-- step: email -->
        <div id="step-email">
          <form id="form-email">
            <label style="display:block;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#7d7770;margin-bottom:10px;" data-k="emailLabel"></label>
            <input id="in-email" class="field-input" type="email" data-kph="emailPh" style="width:100%;background:#0d0c11;border:1px solid #2a2731;color:#f2ede6;font-family:'JetBrains Mono',monospace;font-size:16px;padding:15px 16px;outline:none;letter-spacing:.02em;">
            <button type="submit" class="btn-cta" style="margin-top:14px;width:100%;background:#e23b2e;color:#120606;font-family:'Tektur',sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:.16em;font-size:15px;padding:16px;border:none;cursor:pointer;" data-k="btnQueue"></button>
          </form>
          <div id="err-email" style="margin-top:10px;font-family:'JetBrains Mono',monospace;font-size:12px;color:#e23b2e;display:none;"></div>
        </div>

        <!-- step: challenge -->
        <div id="step-challenge" style="display:none;">
          <form id="form-challenge">
            <label style="display:block;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#7d7770;margin-bottom:10px;" data-k="challengeLabel"></label>
            <textarea id="in-challenge" class="field-input" rows="3" data-kph="challengePh" style="width:100%;resize:vertical;background:#0d0c11;border:1px solid #2a2731;color:#f2ede6;font-family:'JetBrains Mono',monospace;font-size:15px;line-height:1.5;padding:14px 16px;outline:none;"></textarea>
            <button type="submit" class="btn-cta" style="margin-top:14px;width:100%;background:#e23b2e;color:#120606;font-family:'Tektur',sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:.16em;font-size:15px;padding:16px;border:none;cursor:pointer;" data-k="btnNext"></button>
          </form>
          <div id="err-challenge" style="margin-top:10px;font-family:'JetBrains Mono',monospace;font-size:12px;color:#e23b2e;display:none;"></div>
        </div>

        <!-- step: bet -->
        <div id="step-bet" style="display:none;">
          <label style="display:block;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#7d7770;margin-bottom:14px;" data-k="betLabel"></label>
          <div style="display:flex;gap:12px;">
            <button class="bet-yes" onclick="bet('yes')" style="flex:1;background:transparent;color:#f2ede6;font-family:'Tektur',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-size:15px;padding:15px;border:1px solid #e23b2e;cursor:pointer;" data-k="betYes"></button>
            <button class="bet-no" onclick="bet('no')" style="flex:1;background:transparent;color:#cbc5bd;font-family:'Tektur',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-size:15px;padding:15px;border:1px solid #3a3540;cursor:pointer;" data-k="betNo"></button>
          </div>
          <button onclick="bet('skip')" style="margin-top:14px;width:100%;background:none;border:none;color:#6f6a63;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.1em;cursor:pointer;text-decoration:underline;text-underline-offset:3px;" data-k="skip"></button>
        </div>

        <!-- step: done -->
        <div id="step-done" style="display:none;">
          <div style="text-align:center;padding:6px 0;">
            <div style="font-family:'Press Start 2P',monospace;font-size:10px;letter-spacing:.08em;color:#e23b2e;margin-bottom:18px;">✶ ✶ ✶</div>
            <div style="font-family:'Tektur',sans-serif;font-weight:800;font-size:30px;text-transform:uppercase;letter-spacing:.04em;color:#f4efe8;line-height:1.05;" data-k="doneTitle"></div>
            <div style="margin-top:8px;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:#e23b2e;" data-k="doneAlt"></div>
            <div style="margin:22px auto 0;display:inline-block;border:1px solid #2a2530;padding:12px 22px;font-family:'JetBrains Mono',monospace;font-size:14px;color:#cbc5bd;"><span data-k="queueLabel"></span>&nbsp;&nbsp;<span id="pos" style="color:#f4efe8;font-weight:700;"></span></div>

(function(){
  const els = document.querySelectorAll('.reveal');
  const countUp = (el)=>{
    const target = parseInt(el.getAttribute('data-count'),10);
    if(isNaN(target)) return;
    const dur = 1100, t0 = performance.now();
    const tick = (now)=>{ const p = Math.min(1,(now-t0)/dur); el.textContent = Math.round(target*(0.5-0.5*Math.cos(p*Math.PI))); if(p<1) requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  };
  const fire = (el)=>{
    const delay = parseInt(el.getAttribute('data-delay')||'0',10);
    setTimeout(()=>{ el.classList.add('in'); el.querySelectorAll('[data-count]').forEach(countUp); if(el.hasAttribute('data-count')) countUp(el); }, delay);
  };
  if(!('IntersectionObserver' in window)){ els.forEach(fire); return; }
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(en=>{ if(en.isIntersecting){ fire(en.target); io.unobserve(en.target); } });
  }, { threshold:0.18 });
  els.forEach(e=>io.observe(e));
})();

    if(down){ px(hx,ey+16,3,3,P.skin); px(hx+1,ey+19,1,5,A); px(hx,ey+22,2,2,P.skin); }
    else { px(hx,ey+15,3,3,P.skin); px(hx+1,ey+11,1,4,P.skin); }
  };

  const brazierGlow = (bx,glow)=>{ g.save(); g.globalCompositeOperation='lighter'; const r=g.createRadialGradient(bx,172,2,bx,172,48); r.addColorStop(0,'rgba(244,150,40,'+(0.24*glow)+')'); r.addColorStop(1,'rgba(244,150,40,0)'); g.fillStyle=r; g.fillRect(bx-52,118,104,108); g.restore(); };
  const brazier = (bx,t)=>{
    px(bx-1,180,3,40,'#241c1a'); px(bx-1,180,1,40,'#352a26');
    px(bx-4,176,9,6,'#2a2128'); px(bx-4,176,9,1,'#3a3140');
    const f = Math.sin(t*14+bx)*0.5 + Math.sin(t*9+bx*1.3)*0.5;
    const h = 8 + Math.round(f*3);
    px(bx-3,176-h,6,h,'#c0531a'); px(bx-2,176-h-2,4,h,'#ef8b23'); px(bx-1,176-h-3,2,h-2,'#f9c45a'); px(bx-1,176-h-1,1,3,'#ffe9b0');
    if(Math.random()<0.3) px(bx-2+rnd(4),176-h-3-rnd(4),1,1,'#f9c45a');
  };

  let lastSpark = 0;
  const start = performance.now();
  const loop = (now)=>{
    const sp = (arenaConfig.fightSpeed) || 1;
    const glow = (typeof arenaConfig.ambientGlow === 'number') ? arenaConfig.ambientGlow : 0.6;
    const showEmp = !(arenaConfig.showEmperor === false);
    const t = ((now - start)/1000) * sp;
    const T = 3.4, tt = (t % T)/T;
    const lng = (s,e)=>{ if(tt<s||tt>e) return 0; const u=(tt-s)/(e-s); return Math.sin(u*Math.PI); };
    const aL = lng(0.08,0.30), bL = lng(0.56,0.80);
    const spark = Math.max(aL,bL);
    const sparkOn = spark>0.62 ? (spark-0.62)/0.38 : 0;
    let shx=0, shy=0; if(sparkOn>0){ shx=(Math.random()-0.5)*sparkOn*5; shy=(Math.random()-0.5)*sparkOn*5; }

    g.clearRect(0,0,480,270);
    const sky = g.createLinearGradient(0,0,0,270); sky.addColorStop(0,'#0c0b14'); sky.addColorStop(0.55,'#0a0910'); sky.addColorStop(1,'#070608'); g.fillStyle = sky; g.fillRect(0,0,480,270);

    px(0,30,480,26,'#0d0b13');
    crowdU.forEach(d=>{ const fl=0.5+0.5*Math.sin(t*2+d.x); const sk=d.c<0.1; px(d.x,d.y,2,2, sk?'#5a4636':('rgba(42,38,52,'+(0.45+0.3*fl)+')')); });
    for(let ax=-12; ax<492; ax+=44){
      px(ax,58,8,82,'#171420'); px(ax,58,2,82,'#221d2c');
      px(ax+8,72,36,68,'#0a0810');
      px(ax+8,58,36,14,'#171420'); px(ax+8,58,36,3,'#241f2e');
    }
    crowdF.forEach(d=>{ const fl=0.5+0.5*Math.sin(t*1.7+d.x*0.7); const sk=d.c<0.12; px(d.x,d.y,2,2, sk?'#6a5240':('rgba(34,30,42,'+(0.5+0.3*fl)+')')); });
    px(0,146,480,6,'#1c1826'); px(0,146,480,2,'#2a2433');

    if(showEmp) emperor(sparkOn>0.4, sparkOn);

    const sand = g.createLinearGradient(0,150,0,270); sand.addColorStop(0,'#221c14'); sand.addColorStop(1,'#15100a'); g.fillStyle = sand; g.fillRect(0,150,480,120);
    for(let i=0;i<96;i++){ const sx=(i*53)%480, sy=153+((i*29)%114); px(sx,sy,1,1, (i%5)?'rgba(60,50,34,0.5)':'rgba(18,14,9,0.6)'); }

    g.save(); g.globalCompositeOperation='lighter'; const cg=g.createRadialGradient(254,212,4,254,212,120); cg.addColorStop(0,'rgba(244,150,40,'+(0.08*glow+0.04)+')'); cg.addColorStop(1,'rgba(244,150,40,0)'); g.fillStyle=cg; g.fillRect(0,150,480,120); g.restore();

    brazierGlow(66,glow); brazierGlow(414,glow);

    gladA(226,t,aL);
    g.save(); g.translate(2*282,0); g.scale(-1,1); gladB(282,t,bL); g.restore();

    brazier(66,t); brazier(414,t);

    if(sparkOn>0.55 && lastSpark<=0.55){
      for(let i=0;i<13;i++){ const a=rnd(6.28); parts.push({ x:254, y:222, vx:Math.cos(a)*(0.5+rnd(1.5)), vy:-rnd(1.7), life:1, c: Math.random()<0.5?A:'#f9c45a' }); }
    }
    lastSpark = sparkOn;

    if(sparkOn>0){
      const sxp=254, syp=222;
      g.save(); g.globalCompositeOperation='lighter';
      const rg=g.createRadialGradient(sxp,syp,1,sxp,syp,18*sparkOn); rg.addColorStop(0,'rgba(255,232,182,'+(0.9*sparkOn)+')'); rg.addColorStop(0.4,'rgba(244,150,40,'+(0.5*sparkOn)+')'); rg.addColorStop(1,'rgba(244,150,40,0)'); g.fillStyle=rg; g.fillRect(sxp-20,syp-20,40,40); g.restore();
      g.fillStyle='#ffe9b0'; const n=Math.round(sparkOn*5);
      for(let i=0;i<n;i++){ const a=rnd(6.28), d=rnd(8*sparkOn); g.fillRect(Math.round(sxp+Math.cos(a)*d),Math.round(syp+Math.sin(a)*d),1,1); }
    }

    parts = parts.filter(p=>p.life>0);
    parts.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=0.09; p.life-=0.03; g.globalAlpha=Math.max(0,p.life); px(p.x,p.y,1,1,p.c); }); g.globalAlpha=1;

    dust.forEach(d=>{ d.y-=d.s*0.15; d.x+=Math.sin(t+d.r*9)*0.1; if(d.y<118){ d.y=270; d.x=rnd(480); } g.globalAlpha=0.13+d.r*0.1; px(d.x,d.y,1,1,'#caa46a'); }); g.globalAlpha=1;

    const cw=cv.width, ch=cv.height;
    const S=Math.max(cw/480, ch/270);
    const dz=1+prog*0.14, sc=S*dz;
    const fcx=240, fcy=150+prog*60;
    const dx=cw/2 - fcx*sc + shx*dpr, dy=ch/2 - fcy*sc + shy*dpr;
    mctx.setTransform(1,0,0,1,0,0); mctx.imageSmoothingEnabled=false;
    mctx.fillStyle='#070608'; mctx.fillRect(0,0,cw,ch);
    mctx.drawImage(buf,0,0,480,270,dx,dy,480*sc,270*sc);

    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
})();
</script>
