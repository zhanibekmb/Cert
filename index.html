<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cert — The Streak You Can't Fake</title>
<meta name="description" content="Set one goal. Send live proof every day — a photo, a video, or a location check-in. An AI judge decides if it counts. Free on the App Store.">
<meta property="og:title" content="Cert — The Streak You Can't Fake">
<meta property="og:description" content="One goal. Live proof every day. An AI judge decides if it counts. Free on the App Store.">
<meta property="og:type" content="website">
<link rel="icon" type="image/png" href="assets/logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#4f46e5; --accent-deep:#4338ca; --accent-soft:#eef2ff;
    --ink:#0e1116; --mute:#5b6472; --faint:#98a1ae;
    --bg:#ffffff; --card:#f6f8fb; --line:#e7eaf1;
    --dark:#12102b; --dark2:#1e1b4e; --dark-ink:#f2f0ff; --dark-mute:#b9beF8;
    --err:#dc2626; --ok:#16a34a;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  html,body{margin:0;padding:0;background:var(--bg);}
  body{font-family:'Inter',-apple-system,sans-serif;color:var(--ink);overflow-x:hidden;-webkit-font-smoothing:antialiased;}
  ::selection{background:var(--accent);color:#fff;}
  a{color:inherit;}
  .wrap{max-width:1120px;margin:0 auto;padding:0 24px;}
  .btn{display:inline-flex;align-items:center;gap:9px;background:var(--accent);color:#fff;border:none;border-radius:13px;padding:15px 26px;font:inherit;font-weight:700;font-size:16px;text-decoration:none;cursor:pointer;transition:transform .15s,box-shadow .15s;}
  .btn:hover{transform:translateY(-1px);box-shadow:0 10px 30px rgba(79,70,229,.28);}
  .btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);}
  .btn.ghost:hover{border-color:var(--accent);color:var(--accent);box-shadow:none;}
  .btn.light{background:#fff;color:var(--accent-deep);}
  .kicker{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);}
  h1,h2,h3,h4{margin:0;font-weight:900;letter-spacing:-.025em;line-height:1.03;}
  h1{font-size:clamp(42px,6.4vw,74px);}
  h2{font-size:clamp(30px,4.4vw,48px);}
  .lead{font-size:clamp(18px,2vw,21px);line-height:1.55;color:var(--mute);}
  .sub{font-size:17px;line-height:1.6;color:var(--mute);}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px;}
  .chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:9px 15px;font-size:13.5px;font-weight:600;color:var(--mute);background:#fff;}
  .chip svg{width:15px;height:15px;color:var(--accent);flex:none;}
  .icon-box{width:46px;height:46px;border-radius:13px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;color:var(--accent);flex:none;}
  .icon-box svg{width:22px;height:22px;}
  .navlink{text-decoration:none;font-size:14px;font-weight:600;color:var(--mute);}
  .navlink:hover{color:var(--accent);}
  .lang-btn{background:none;border:none;padding:5px 8px;font:inherit;font-size:12px;font-weight:700;color:var(--faint);cursor:pointer;border-radius:7px;}
  .lang-btn.active{background:var(--accent);color:#fff;}
  .acc-q{width:100%;text-align:left;background:none;border:none;padding:20px 0;font:inherit;font-size:17px;font-weight:700;color:var(--ink);cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:14px;}
  .acc-q:hover{color:var(--accent);}
  .acc-a{display:none;padding:0 0 20px;color:var(--mute);font-size:15.5px;line-height:1.65;}
  .acc-item{border-bottom:1px solid var(--line);}
  .acc-item.open .acc-a{display:block;}
  .acc-item.open .acc-x{transform:rotate(45deg);}
  .acc-x{transition:transform .15s;color:var(--accent);font-size:22px;font-weight:700;flex:none;}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:22px;}
  .pro-tag{font-size:11px;font-weight:900;color:var(--accent);border:1.5px solid var(--accent);border-radius:6px;padding:2px 6px;vertical-align:middle;letter-spacing:.04em;}
  /* phone */
  .phone{width:300px;border:11px solid #0e1116;border-radius:44px;background:#fff;box-shadow:0 40px 90px rgba(14,17,22,.20);overflow:hidden;flex:none;}
  .phone-notch{height:26px;display:flex;justify-content:center;align-items:flex-start;background:#fff;}
  .phone-notch i{width:118px;height:22px;background:#0e1116;border-radius:0 0 15px 15px;}
  .phone .screen{padding:16px 15px 22px;min-height:430px;}
  .pcell{width:16px;height:16px;border-radius:5px;background:#e8ecf1;}
  .pcell.on{background:var(--accent);}
  .pcell.fr{background:transparent;border:1.6px solid var(--accent);}
  /* interactive how-it-works */
  .pills{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px;}
  .pill{border:1.5px solid var(--line);background:#fff;color:var(--mute);border-radius:999px;padding:10px 18px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;transition:all .15s;}
  .pill:hover{border-color:var(--accent);color:var(--accent);}
  .pill.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .how-grid{display:grid;grid-template-columns:1fr 340px;gap:48px;margin-top:40px;align-items:start;}
  .steps{display:flex;flex-direction:column;gap:0;}
  .step{display:flex;gap:16px;opacity:.5;transition:opacity .3s;padding-bottom:8px;}
  .step.on{opacity:1;}
  .step .rail{display:flex;flex-direction:column;align-items:center;flex:none;}
  .step .dot{width:34px;height:34px;border-radius:17px;background:var(--card);border:1.5px solid var(--line);color:var(--faint);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;transition:all .3s;}
  .step.on .dot{background:var(--accent);border-color:var(--accent);color:#fff;}
  .step .conn{width:2px;flex:1;background:var(--line);margin:4px 0;min-height:26px;transition:background .3s;}
  .step.done .conn{background:var(--accent);}
  .step .body{padding-bottom:22px;}
  .step h4{font-size:19px;margin-bottom:6px;}
  .step p{margin:0;color:var(--mute);font-size:15px;line-height:1.55;}
  .step .bar{height:3px;border-radius:2px;background:var(--line);margin-top:14px;overflow:hidden;display:none;}
  .step.on .bar{display:block;}
  .step .bar i{display:block;height:3px;background:var(--accent);width:0%;}
  .how-phone{position:sticky;top:90px;display:flex;justify-content:center;}
  .caret{display:inline-block;width:2px;height:1em;background:var(--accent);vertical-align:-2px;animation:blink 1s steps(1) infinite;}
  @keyframes blink{50%{opacity:0;}}
  .stat-num{font-size:clamp(30px,4vw,44px);font-weight:900;letter-spacing:-.03em;color:var(--ink);}
  @media(max-width:900px){
    .grid3{grid-template-columns:1fr;}.grid2{grid-template-columns:1fr;}
    .hero-flex{flex-direction:column;text-align:center;}.hero-flex .chips,.hero-flex .hero-cta{justify-content:center;}
    .how-grid{grid-template-columns:1fr;gap:12px;}.how-phone{position:static;order:-1;margin-bottom:8px;}
  }
  @media(max-width:560px){.navlink.hide-sm{display:none;}}
</style>
</head>
<body>

<!-- NAV -->
<header style="position:sticky;top:0;z-index:50;background:rgba(255,255,255,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);">
  <div class="wrap" style="display:flex;align-items:center;gap:22px;height:66px;">
    <a href="#top" style="display:flex;align-items:center;gap:9px;text-decoration:none;">
      <img src="assets/logo-mark.png" alt="Cert" style="width:30px;height:30px;">
      <span style="font-weight:900;font-size:19px;letter-spacing:.04em;">CERT</span>
    </a>
    <nav style="display:flex;gap:22px;margin-left:auto;align-items:center;">
      <a class="navlink hide-sm" href="#how" data-k="navHow"></a>
      <a class="navlink hide-sm" href="#flex" data-k="navFeatures"></a>
      <a class="navlink hide-sm" href="#faq">FAQ</a>
      <a class="navlink hide-sm" href="pricing.html" data-k="navPricing"></a>
      <a class="btn" style="padding:10px 17px;font-size:14px;" href="https://apps.apple.com/app/id6786159294" target="_blank" rel="noopener">
        <svg width="15" height="17" viewBox="0 0 15 17" fill="currentColor"><path d="M12.4 9c0-2 1.6-3 1.7-3-1-1.4-2.4-1.6-2.9-1.6-1.2-.1-2.4.7-3 .7-.7 0-1.6-.7-2.7-.7C4.1 4.5 2.8 5.3 2 6.6c-1.5 2.6-.4 6.4 1.1 8.5.7 1 1.5 2.2 2.6 2.1 1.1 0 1.5-.7 2.8-.7s1.6.7 2.8.7c1.1 0 1.9-1 2.6-2.1.8-1.2 1.1-2.4 1.2-2.4-.1 0-2.7-1-2.7-3.7zM10.4 2.8c.6-.7 1-1.7.9-2.8-.9 0-1.9.6-2.5 1.3-.6.6-1 1.6-.9 2.6 1 .1 1.9-.5 2.5-1.1z"/></svg>
        App Store
      </a>
      <div style="display:flex;gap:2px;">
        <button id="lang-en" class="lang-btn active" onclick="setLang('en')">EN</button>
        <button id="lang-ru" class="lang-btn" onclick="setLang('ru')">RU</button>
      </div>
    </nav>
  </div>
</header>

<!-- HERO -->
<section id="top" style="padding:78px 0 60px;">
  <div class="wrap hero-flex" style="display:flex;align-items:center;gap:56px;">
    <div style="flex:1;min-width:0;">
      <span class="kicker" data-k="heroKicker"></span>
      <h1 style="margin-top:16px;"><span data-k="heroH1a"></span> <span style="color:var(--accent);" data-k="heroH1b"></span></h1>
      <p class="lead" style="margin:24px 0 32px;max-width:500px;" data-k="heroSub"></p>
      <div class="hero-cta" style="display:flex;gap:14px;flex-wrap:wrap;align-items:center;">
        <a class="btn" href="https://apps.apple.com/app/id6786159294" target="_blank" rel="noopener">
          <svg width="17" height="19" viewBox="0 0 15 17" fill="currentColor"><path d="M12.4 9c0-2 1.6-3 1.7-3-1-1.4-2.4-1.6-2.9-1.6-1.2-.1-2.4.7-3 .7-.7 0-1.6-.7-2.7-.7C4.1 4.5 2.8 5.3 2 6.6c-1.5 2.6-.4 6.4 1.1 8.5.7 1 1.5 2.2 2.6 2.1 1.1 0 1.5-.7 2.8-.7s1.6.7 2.8.7c1.1 0 1.9-1 2.6-2.1.8-1.2 1.1-2.4 1.2-2.4-.1 0-2.7-1-2.7-3.7zM10.4 2.8c.6-.7 1-1.7.9-2.8-.9 0-1.9.6-2.5 1.3-.6.6-1 1.6-.9 2.6 1 .1 1.9-.5 2.5-1.1z"/></svg>
          <span data-k="heroCta"></span>
        </a>
        <span style="font-size:13.5px;color:var(--faint);font-weight:600;" data-k="heroFree"></span>
      </div>
      <div class="chips" style="display:flex;gap:10px;flex-wrap:wrap;margin-top:32px;">
        <span class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="13" rx="3"/><circle cx="12" cy="13.5" r="3.2"/><path d="M8 7l1.4-2.2h5.2L16 7"/></svg><span data-k="chipLive"></span></span>
        <span class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4"/><path d="M12 3l7 3v5c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/></svg><span data-k="chipAI"></span></span>
        <span class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><path d="M16 5.5a3.2 3.2 0 0 1 0 6M17 19a5.5 5.5 0 0 0-3-4.9"/></svg><span data-k="chipFriends"></span></span>
      </div>
    </div>
    <!-- HERO PHONE (CSS mock; swap for <img class="shot" src="assets/landing/screen-home.png"> when you have a real screenshot) -->
    <div class="phone">
      <div class="phone-notch"><i></i></div>
      <div class="screen" style="min-height:auto;">
        <div style="font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--faint);text-transform:uppercase;" data-k="mockToday"></div>
        <div style="background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:10px;">
          <div style="display:flex;align-items:center;gap:8px;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="var(--accent)"><path d="M12 2c1 3-1.5 4-1.5 7a4.5 4.5 0 0 0 9 0c0-2-1-3.5-1-3.5 2 1.5 3.5 4 3.5 7a8 8 0 1 1-16 0c0-4.5 4-6.5 6-10.5z"/></svg>
            <span style="font-size:30px;font-weight:900;">23</span>
            <span style="font-size:12px;color:var(--mute);font-weight:600;" data-k="mockDays"></span>
          </div>
          <div style="font-weight:700;margin-top:8px;font-size:15px;" data-k="mockGoal"></div>
          <div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:12px;">
            <i class="pcell on"></i><i class="pcell on"></i><i class="pcell on"></i><i class="pcell on"></i><i class="pcell on"></i><i class="pcell fr"></i><i class="pcell on"></i><i class="pcell on"></i><i class="pcell on"></i><i class="pcell on"></i><i class="pcell on"></i><i class="pcell on"></i><i class="pcell"></i><i class="pcell"></i>

          <span style="display:inline-flex;width:20px;height:20px;border-radius:10px;background:var(--accent);color:#fff;align-items:center;justify-content:center;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><path d="M5 12l4 4 10-10"/></svg></span>
          <span style="font-size:12.5px;font-weight:600;color:var(--accent-deep);" data-k="mockVerdict"></span>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- STATS (honest product truths, not fabricated metrics) -->
<section style="padding:20px 0 64px;">
  <div class="wrap grid3">
    <div style="text-align:center;"><div class="stat-num">1</div><div class="sub" style="margin-top:4px;" data-k="stat1"></div></div>
    <div style="text-align:center;"><div class="stat-num" data-k="stat2n"></div><div class="sub" style="margin-top:4px;" data-k="stat2"></div></div>
    <div style="text-align:center;"><div class="stat-num">0</div><div class="sub" style="margin-top:4px;" data-k="stat3"></div></div>
  </div>
</section>

<!-- HOW IT WORKS (interactive) -->
<section id="how" style="padding:78px 0;background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line);">
  <div class="wrap">
    <span class="kicker" data-k="howKicker"></span>
    <h2 style="margin-top:14px;max-width:600px;" data-k="howH"></h2>
    <div class="pills" id="howPills"></div>
    <div class="how-grid">

      <div class="how-phone"><div class="phone"><div class="phone-notch"><i></i></div><div class="screen" id="howScreen"></div></div></div>

</section>

<!-- FLEXIBILITY / FEATURES -->

  <div class="wrap">
    <span class="kicker" data-k="flexKicker"></span>
    <h2 style="margin-top:14px;max-width:600px;" data-k="flexH"></h2>
    <div class="grid3" style="margin-top:40px;">
      <div class="card"><div class="icon-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l7 3v5c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/><path d="M9 12l2 2 4-4"/></svg></div><h4 style="margin:16px 0 6px;font-size:19px;" data-k="f1H"></h4><p style="margin:0;color:var(--mute);font-size:15px;line-height:1.6;" data-k="f1T"></p></div>
      <div class="card"><div class="icon-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12a8 8 0 1 1 3 6.2"/><path d="M4 20v-4h4"/></svg></div><h4 style="margin:16px 0 6px;font-size:19px;" data-k="f2H"></h4><p style="margin:0;color:var(--mute);font-size:15px;line-height:1.6;" data-k="f2T"></p></div>
      <div class="card"><div class="icon-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M4 7l16 10M20 7L4 17M12 4l3 2-3 2-3-2zM12 20l3-2-3-2-3 2z"/></svg></div><h4 style="margin:16px 0 6px;font-size:19px;" data-k="f3H"></h4><p style="margin:0;color:var(--mute);font-size:15px;line-height:1.6;" data-k="f3T"></p></div>
      <div class="card"><div class="icon-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21c5-5 7-8.2 7-11a7 7 0 1 0-14 0c0 2.8 2 6 7 11z"/><circle cx="12" cy="10" r="2.6"/></svg></div><h4 style="margin:16px 0 6px;font-size:19px;" data-k="f4H"></h4><p style="margin:0;color:var(--mute);font-size:15px;line-height:1.6;" data-k="f4T"></p></div>
      <div class="card"><div class="icon-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 15l3-3 2 2 4-5"/></svg></div><h4 style="margin:16px 0 6px;font-size:19px;" data-k="f5H"></h4><p style="margin:0;color:var(--mute);font-size:15px;line-height:1.6;" data-k="f5T"></p></div>
      <div class="card"><div class="icon-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><path d="M16 5.5a3.2 3.2 0 0 1 0 6M17 19a5.5 5.5 0 0 0-3-4.9"/></svg></div><h4 style="margin:16px 0 6px;font-size:19px;" data-k="f6H"></h4><p style="margin:0;color:var(--mute);font-size:15px;line-height:1.6;" data-k="f6T"></p></div>
    </div>
  </div>
</section>

<!-- THE JUDGE (dark band) -->
<section style="padding:84px 0;background:linear-gradient(160deg,var(--dark),var(--dark2));">
  <div class="wrap grid2" style="align-items:center;">
    <div>
      <span class="kicker" style="color:var(--dark-mute);" data-k="judgeKicker"></span>
      <h2 style="color:var(--dark-ink);margin-top:14px;" data-k="judgeH"></h2>
      <p style="color:var(--dark-mute);font-size:17px;line-height:1.65;margin:20px 0 0;" data-k="judgeT"></p>
      <ul style="margin:22px 0 0;padding:0;list-style:none;color:var(--dark-ink);font-size:15.5px;line-height:2.15;font-weight:600;">
        <li style="display:flex;gap:10px;align-items:flex-start;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--dark-mute)" stroke-width="2.5" style="margin-top:6px;flex:none;"><path d="M5 12l4 4 10-10"/></svg><span data-k="judgeL1"></span></li>
        <li style="display:flex;gap:10px;align-items:flex-start;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--dark-mute)" stroke-width="2.5" style="margin-top:6px;flex:none;"><path d="M5 12l4 4 10-10"/></svg><span data-k="judgeL2"></span></li>
        <li style="display:flex;gap:10px;align-items:flex-start;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--dark-mute)" stroke-width="2.5" style="margin-top:6px;flex:none;"><path d="M5 12l4 4 10-10"/></svg><span data-k="judgeL3"></span></li>
      </ul>
    </div>
    <div style="display:flex;justify-content:center;">
      <div style="transform:rotate(-7deg);border:4px solid var(--dark-mute);border-radius:18px;padding:24px 38px;box-shadow:0 0 70px rgba(185,190,248,.30);">
        <div style="color:#fff;font-size:36px;font-weight:900;letter-spacing:.1em;">APPROVED ✓</div>
        <div style="color:var(--dark-mute);font-size:13px;font-weight:700;text-align:center;margin-top:8px;letter-spacing:.08em;text-transform:uppercase;" data-k="judgeStampSub"></div>
      </div>
    </div>
  </div>
</section>

<!-- CHALLENGES -->
<section style="padding:82px 0;">
  <div class="wrap grid2" style="align-items:center;">
    <div>
      <span class="kicker" data-k="chKicker"></span>
      <h2 style="margin-top:14px;" data-k="chH"></h2>

      +'<div style="font-size:12px;color:var(--mute);font-weight:600;">'+(lang==="ru"?"Докажу через":"I'll prove it with")+' '+proofPill+'</div>'
      +'<div style="margin-top:12px;border:1.5px solid var(--accent);border-radius:12px;padding:13px;font-weight:700;font-size:15px;min-height:46px;">'+typed+'<span class="caret"></span></div>'
      +'<div style="margin-top:14px;background:#e9ecf3;color:var(--faint);border-radius:11px;text-align:center;font-weight:700;font-size:13.5px;padding:12px;">'+(lang==="ru"?"Создать цель":"Create goal")+'</div></div>';
  }
  if(step===1){
    let inner='';
    if(c==="photo") inner='<div style="aspect-ratio:1;border-radius:16px;background:linear-gradient(160deg,#2a2f3a,#12151a);display:flex;align-items:flex-end;justify-content:center;padding-bottom:16px;"><div style="width:52px;height:52px;border-radius:26px;background:#fff;border:4px solid #cfd4dd;"></div></div>';
    else if(c==="video") inner='<div style="aspect-ratio:1;border-radius:16px;background:linear-gradient(160deg,#2a2f3a,#12151a);display:flex;align-items:flex-start;justify-content:space-between;padding:14px;"><span style="background:#ef4444;color:#fff;font-size:11px;font-weight:800;padding:4px 8px;border-radius:8px;">REC 0:07</span><span style="color:#fff;font-weight:800;font-size:12px;">0:30</span></div>';
    else if(c==="geo") inner='<div style="aspect-ratio:1.3;border-radius:16px;background:linear-gradient(160deg,#dfe4ff,#eef2ff);position:relative;overflow:hidden;"><div style="position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);color:var(--accent);"><svg width="34" height="34" viewBox="0 0 24 24" fill="var(--accent)"><path d="M12 21c5-5 7-8.2 7-11a7 7 0 1 0-14 0c0 2.8 2 6 7 11z"/><circle cx="12" cy="10" r="2.4" fill="#fff"/></svg></div></div><div style="margin-top:12px;background:var(--accent);border-radius:11px;color:#fff;text-align:center;font-weight:700;font-size:13.5px;padding:12px;">'+(lang==="ru"?"Отметиться":"Check in")+'</div>';
    else inner='<div style="background:var(--card);border:1px solid var(--line);border-radius:13px;padding:11px;display:flex;align-items:center;gap:10px;"><span style="width:24px;height:24px;border-radius:12px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;">1</span><b style="flex:1;font-size:14px;">You</b><span style="color:var(--accent);font-weight:800;">5</span></div><div style="background:var(--card);border:1px solid var(--line);border-radius:13px;padding:11px;display:flex;align-items:center;gap:10px;margin-top:8px;"><span style="width:24px;height:24px;border-radius:12px;background:#e9ecf3;color:var(--mute);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;">2</span><b style="flex:1;font-size:14px;">Dias</b><span style="color:var(--mute);font-weight:800;">4</span></div>';
    return head+'<div style="margin-top:12px;">'+inner+'</div>';
  }
  // step 2 — verdict
  if(c==="challenge"){
    return head+'<div style="margin-top:12px;text-align:center;"><div style="font-size:44px;font-weight:900;color:var(--accent);">🏁</div><div style="font-weight:800;font-size:16px;margin-top:6px;">'+(lang==="ru"?"Последний крутит колесо":"Last place spins the wheel")+'</div><div style="margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:11px;display:flex;align-items:center;gap:10px;"><b style="flex:1;font-size:14px;color:var(--err);">Timur</b><span style="color:var(--err);font-weight:800;font-size:12px;">'+(lang==="ru"?"ПОСЛЕДНИЙ":"LAST")+'</span></div></div>';
  }
  return head+'<div style="margin-top:20px;display:flex;flex-direction:column;align-items:center;gap:14px;">'
    +'<div style="transform:rotate(-7deg);border:3.5px solid var(--accent);border-radius:14px;padding:12px 22px;"><div style="color:var(--accent);font-size:24px;font-weight:900;letter-spacing:.08em;">APPROVED ✓</div></div>'
    +'<div style="display:flex;align-items:center;gap:8px;"><svg width="22" height="22" viewBox="0 0 24 24" fill="var(--accent)"><path d="M12 2c1 3-1.5 4-1.5 7a4.5 4.5 0 0 0 9 0c0-2-1-3.5-1-3.5 2 1.5 3.5 4 3.5 7a8 8 0 1 1-16 0c0-4.5 4-6.5 6-10.5z"/></svg><span style="font-size:30px;font-weight:900;">24</span><span style="font-size:12px;color:var(--mute);font-weight:600;">'+(lang==="ru"?"дней подряд":"day streak")+'</span></div></div>';
}

function renderPills(){
  const el=document.getElementById("howPills");
  el.innerHTML="";
  CATS.forEach((c,i)=>{
    const b=document.createElement("button");
    b.className="pill"+(i===cat?" active":"");
    b.innerHTML=T[lang].how[c].label;
    b.onclick=()=>{ cat=i; step=0; prog=0; lastT=0; startTypewriter(); renderAll(); };
    el.appendChild(b);
  });
}
function renderSteps(){
  const el=document.getElementById("howSteps"); const d=D();
  el.innerHTML="";
  d.steps.forEach((s,i)=>{
    const div=document.createElement("div");
    div.className="step"+(i===step?" on":"")+(i<step?" done":"");
    const conn=i<d.steps.length-1?'<div class="conn"></div>':'';
    div.innerHTML='<div class="rail"><div class="dot">'+(i+1)+'</div>'+conn+'</div>'
      +'<div class="body"><h4>'+s[0]+'</h4><p>'+s[1]+'</p><div class="bar"><i style="width:'+(i===step?Math.round(prog*100):0)+'%"></i></div></div>';
    el.appendChild(div);
  });
}
function renderPhone(){ document.getElementById("howScreen").innerHTML=phoneHTML(); }
function renderAll(){ renderPills(); renderSteps(); renderPhone(); }

function startTypewriter(){
  clearInterval(tw); typed="";
  const full=D().goal; let i=0;
  tw=setInterval(()=>{ i++; typed=full.slice(0,i); if(step===0) renderPhone(); if(i>=full.length) clearInterval(tw); }, 55);
}
function frame(t){
  if(!lastT) lastT=t;
  prog += (t-lastT)/STEP_MS; lastT=t;
  if(prog>=1){
    prog=0; step++;
    if(step>2){ step=0; cat=(cat+1)%CATS.length; startTypewriter(); }
    renderAll();
  } else {
    // update only the active bar + phone typing cheaply
    const bar=document.querySelector(".step.on .bar i"); if(bar) bar.style.width=Math.round(prog*100)+"%";
  }
  raf=requestAnimationFrame(frame);
}

// ---- i18n + accordions ----
let lang = localStorage.getItem("cert_lang") || ((navigator.language||"").toLowerCase().startsWith("ru")?"ru":"en");
function buildAcc(listId, arr){
  const list=document.getElementById(listId); list.innerHTML="";
  arr.forEach(([q,a])=>{
    const item=document.createElement("div"); item.className="acc-item";
    item.innerHTML='<button class="acc-q">'+q+'<span class="acc-x">+</span></button><div class="acc-a">'+a+'</div>';
    item.querySelector(".acc-q").onclick=()=>item.classList.toggle("open");
    list.appendChild(item);
  });
}
function applyLang(){
  const d=T[lang];
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-k]").forEach(el=>{ const v=d[el.getAttribute("data-k")]; if(v!==undefined) el.innerHTML=v; });
  document.getElementById("lang-en").classList.toggle("active",lang==="en");
  document.getElementById("lang-ru").classList.toggle("active",lang==="ru");
  buildAcc("ucList", d.uc); buildAcc("faqList", d.faq);
  startTypewriter(); renderAll();
}
function setLang(l){ lang=l; localStorage.setItem("cert_lang",l); applyLang(); }
applyLang();
raf=requestAnimationFrame(frame);
</script>
</body>
</html>
