<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:#070608;}
  body{overflow-x:hidden;font-family:'JetBrains Mono',monospace;}
  ::selection{background:#e23b2e;color:#0a0a0b;}
  @keyframes rise{0%{opacity:0;transform:translateY(34px);}100%{opacity:1;transform:translateY(0);}}

  @keyframes flick{0%,100%{opacity:.85;}50%{opacity:1;}}

  .btn-cta:hover{filter:brightness(1.08);transform:translateY(-1px);}

  .lang-btn.active{background:#e23b2e;color:#120606;}
  /* store buttons (top-right) — signal "mobile app" instantly */
  .store-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid #2a2530;border-radius:9px;background:rgba(12,10,16,.55);text-decoration:none;color:#e9e4dc;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;transition:border-color .15s,background .15s,transform .15s;}
  .store-pill:hover{border-color:#e23b2e;background:rgba(226,59,46,.12);transform:translateY(-1px);}
  .store-pill svg{flex:none;display:block;}
  .feat-ico{display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;border:1px solid #3a2a2a;border-radius:12px;background:rgba(226,59,46,.08);}
  @media(max-width:600px){.store-pill span{display:none;}.store-pill{padding:7px 9px;}}
  /* footer */
  .ft-h{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#6f6a63;margin-bottom:16px;}
  .ft-l{display:block;font-family:'JetBrains Mono',monospace;font-size:13px;color:#9a948d;text-decoration:none;margin-bottom:11px;transition:color .15s;}
  .ft-l:hover{color:#e23b2e;}
  /* scroll reveal */
  .reveal{opacity:0;transform:translateY(30px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1);}
  .reveal.in{opacity:1;transform:none;}
  /* how-it-works cards */
  .step-card{transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease;}
  .step-card:hover{transform:translateY(-8px);border-color:#e23b2e!important;box-shadow:0 18px 44px -18px rgba(226,59,46,.55);}
  .step-card:hover .step-num{transform:scale(1.12);text-shadow:0 0 24px rgba(226,59,46,.7);}
  .step-num{display:inline-block;transition:transform .25s ease,text-shadow .25s ease;}
  /* cta glow pulse */
  @keyframes glowpulse{0%,100%{box-shadow:0 0 0 0 rgba(226,59,46,0);}50%{box-shadow:0 0 32px 4px rgba(226,59,46,.45);}}
  .cta-pulse{animation:glowpulse 2.6s ease-in-out infinite;}
  /* shame red glow breathe */
  @keyframes breathe{0%,100%{text-shadow:0 3px 0 #000,0 0 28px rgba(226,59,46,.2);}50%{text-shadow:0 3px 0 #000,0 0 54px rgba(226,59,46,.5);}}
  .breathe{animation:breathe 3.4s ease-in-out infinite;}
  /* hero two-column + phone mockup */
  .hero-row{display:flex;align-items:center;justify-content:center;gap:60px;max-width:1120px;width:100%;}
  .hero-copy{max-width:560px;text-align:left;flex:1 1 440px;}
  .hero-copy p{margin-left:0!important;}
  @keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-12px);}}
  .phone-float{animation:float 5.5s ease-in-out infinite;flex:none;}
  @media(max-width:880px){
    .hero-row{flex-direction:column;gap:44px;}
    .hero-copy{text-align:center;max-width:600px;flex-basis:auto;}
    .hero-copy p{margin-left:auto!important;margin-right:auto!important;}
    .hero-copy .day-strip{align-items:center;}
  }
  @media(max-width:360px){.phone-float{transform:scale(.92);}}
  @media (prefers-reduced-motion:reduce){.reveal{opacity:1!important;transform:none!important;}.cta-pulse,.breathe,.phone-float{animation:none!important;}}

/* ---- state ---- */
const state = { lang:'en', step:'email', bet:null, pos:null, seatsLeft:38, faqOpen:null };
const C = ()=> dict[state.lang];
const esc = (s)=> String(s).replace(/[&<>"]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

function seatsLineText(){
  // concept shift: no scarcity/seats framing — free to start
  return '';
}

function applyLang(){
  const d = C();
  document.querySelectorAll('[data-k]').forEach(el=>{ const k=el.getAttribute('data-k'); if(d[k]!=null) el.textContent=d[k]; });
  document.querySelectorAll('[data-kph]').forEach(el=>{ const k=el.getAttribute('data-kph'); if(d[k]!=null) el.setAttribute('placeholder', d[k]); });
  document.getElementById('seatsLine').textContent = seatsLineText();
  document.documentElement.lang = state.lang;
  document.getElementById('lang-en').classList.toggle('active', state.lang==='en');
  document.getElementById('lang-ru').classList.toggle('active', state.lang==='ru');
  renderFAQ();
}

function setLang(l){ state.lang = l; applyLang(); }

function renderFAQ(){
  const wrap = document.getElementById('faqList');
  const list = C().faq || [];
  wrap.innerHTML = '';
  list.forEach((it,i)=>{
    const open = state.faqOpen === i;
    const item = document.createElement('div');
    item.style.borderBottom = '1px solid #241f29';
    item.innerHTML =
      '<button class="faq-btn" style="width:100%;display:flex;justify-content:space-between;align-items:center;gap:18px;text-align:left;background:none;border:none;cursor:pointer;padding:22px 4px;font-family:\'Tektur\',sans-serif;font-weight:700;font-size:18px;letter-spacing:.01em;color:#f4efe8;">'
      + '<span>'+esc(it.q)+'</span>'
      + '<span style="flex:none;font-family:\'JetBrains Mono\',monospace;font-size:24px;color:#e23b2e;line-height:1;">'+(open?'–':'+')+'</span>'
      + '</button>'
      + (open ? '<p style="margin:0;padding:0 4px 24px;max-width:660px;font-family:\'JetBrains Mono\',monospace;font-size:15px;line-height:1.7;color:#9a948d;">'+esc(it.a)+'</p>' : '');
    item.querySelector('button').addEventListener('click', ()=>{ state.faqOpen = open ? null : i; renderFAQ(); });
    wrap.appendChild(item);
  });
}

/* ---- waitlist flow ---- */
function showStep(){
  ['email','challenge','bet','done'].forEach(st=>{
    document.getElementById('step-'+st).style.display = (state.step===st) ? 'block' : 'none';
  });
  if(state.step==='done'){
    document.getElementById('pos').textContent = '#' + state.pos;
    document.getElementById('seatsLine').textContent = seatsLineText();
  }
}

function showErr(id, msg){
  const el = document.getElementById(id);
  if(msg){ el.textContent = msg; el.style.display = 'block'; }
  else { el.textContent = ''; el.style.display = 'none'; }
}

function submitLead(){
  const payload = {
    email:     document.getElementById('in-email').value.trim(),
    challenge: document.getElementById('in-challenge').value.trim() || null,
    lang:      state.lang,
    country:   (window.CertPrice && CertPrice.country) || null,
    currency:  (window.CertPrice && CertPrice.code) || null
  };
  try {
    fetch(SUPA_URL + '/rest/v1/waitlist', {
      method:'POST',
      headers:{ 'apikey':SUPA_KEY, 'Authorization':'Bearer '+SUPA_KEY, 'Content-Type':'application/json', 'Prefer':'return=minimal' },
      body: JSON.stringify(payload)
    }).catch(()=>{});
    // local fallback copy (e.g. duplicate email or offline) — never blocks success
    const all = JSON.parse(localStorage.getItem('cert_waitlist') || '[]');
    all.push(payload); localStorage.setItem('cert_waitlist', JSON.stringify(all));
  } catch(e){ console.warn('submit failed (showing success anyway):', e); }
}

function finish(){
  state.pos = 100 - state.seatsLeft + 1;
  state.seatsLeft = Math.max(0, state.seatsLeft - 1);
  state.step = 'done';
  submitLead();
  showStep();
}

function bet(v){ state.bet = v; finish(); }

document.getElementById('form-email').addEventListener('submit', (e)=>{
  e.preventDefault();
  const val = document.getElementById('in-email').value.trim();
  const ok = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val);
  if(!ok){ showErr('err-email', C().errEmail); return; }
  showErr('err-email', '');
  state.step = 'challenge'; showStep();
  document.getElementById('in-challenge').focus();
});

document.getElementById('form-challenge').addEventListener('submit', (e)=>{
  e.preventDefault();
  const val = document.getElementById('in-challenge').value.trim();
  if(val.length < 3){ showErr('err-challenge', C().errChallenge); return; }
  showErr('err-challenge', '');
  // no money-bet step in the new concept — go straight to done
  finish();
});

document.getElementById('in-email').addEventListener('input', ()=> showErr('err-email',''));
document.getElementById('in-challenge').addEventListener('input', ()=> showErr('err-challenge',''));

applyLang();
showStep();

/* ---- scroll reveal + count-up ---- */
(function(){
  const els = document.querySelectorAll('.reveal');
  const countUp = (el)=>{
    const target = parseInt(el.getAttribute('data-count'),10);
    if(isNaN(target)) return;
    const dur = 1100, t0 = performance.now();
    const tick = (now)=>{ const p = Math.min(1,(now-t0)/dur); el.textContent = Math.round(target*(0.5-0.5*Math.cos(p*Math.PI))); if(p<1) requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  };
  const fire = (el)=>{
    const delay = parseInt(el.getAttribute('data-delay')||'0',10);
    setTimeout(()=>{ el.classList.add('in'); el.querySelectorAll('[data-count]').forEach(countUp); if(el.hasAttribute('data-count')) countUp(el); }, delay);
  };
  if(!('IntersectionObserver' in window)){ els.forEach(fire); return; }
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(en=>{ if(en.isIntersecting){ fire(en.target); io.unobserve(en.target); } });
  }, { threshold:0.18 });
  els.forEach(e=>io.observe(e));
})();

  const brazierGlow = (bx,glow)=>{ g.save(); g.globalCompositeOperation='lighter'; const r=g.createRadialGradient(bx,172,2,bx,172,48); r.addColorStop(0,'rgba(244,150,40,'+(0.24*glow)+')'); r.addColorStop(1,'rgba(244,150,40,0)'); g.fillStyle=r; g.fillRect(bx-52,118,104,108); g.restore(); };
  const brazier = (bx,t)=>{
    px(bx-1,180,3,40,'#241c1a'); px(bx-1,180,1,40,'#352a26');
    px(bx-4,176,9,6,'#2a2128'); px(bx-4,176,9,1,'#3a3140');
    const f = Math.sin(t*14+bx)*0.5 + Math.sin(t*9+bx*1.3)*0.5;
    const h = 8 + Math.round(f*3);
    px(bx-3,176-h,6,h,'#c0531a'); px(bx-2,176-h-2,4,h,'#ef8b23'); px(bx-1,176-h-3,2,h-2,'#f9c45a'); px(bx-1,176-h-1,1,3,'#ffe9b0');
    if(Math.random()<0.3) px(bx-2+rnd(4),176-h-3-rnd(4),1,1,'#f9c45a');
  };

  let lastSpark = 0;
  const start = performance.now();
  const loop = (now)=>{
    const sp = (arenaConfig.fightSpeed) || 1;
    const glow = (typeof arenaConfig.ambientGlow === 'number') ? arenaConfig.ambientGlow : 0.6;
    const showEmp = !(arenaConfig.showEmperor === false);
    const t = ((now - start)/1000) * sp;
    const T = 3.4, tt = (t % T)/T;
    const lng = (s,e)=>{ if(tt<s||tt>e) return 0; const u=(tt-s)/(e-s); return Math.sin(u*Math.PI); };
    const aL = lng(0.08,0.30), bL = lng(0.56,0.80);
    const spark = Math.max(aL,bL);
    const sparkOn = spark>0.62 ? (spark-0.62)/0.38 : 0;
    let shx=0, shy=0; if(sparkOn>0){ shx=(Math.random()-0.5)*sparkOn*5; shy=(Math.random()-0.5)*sparkOn*5; }

    g.clearRect(0,0,480,270);
    const sky = g.createLinearGradient(0,0,0,270); sky.addColorStop(0,'#0c0b14'); sky.addColorStop(0.55,'#0a0910'); sky.addColorStop(1,'#070608'); g.fillStyle = sky; g.fillRect(0,0,480,270);

    px(0,30,480,26,'#0d0b13');
    crowdU.forEach(d=>{ const fl=0.5+0.5*Math.sin(t*2+d.x); const sk=d.c<0.1; px(d.x,d.y,2,2, sk?'#5a4636':('rgba(42,38,52,'+(0.45+0.3*fl)+')')); });
    for(let ax=-12; ax<492; ax+=44){
      px(ax,58,8,82,'#171420'); px(ax,58,2,82,'#221d2c');
      px(ax+8,72,36,68,'#0a0810');
      px(ax+8,58,36,14,'#171420'); px(ax+8,58,36,3,'#241f2e');
    }
    crowdF.forEach(d=>{ const fl=0.5+0.5*Math.sin(t*1.7+d.x*0.7); const sk=d.c<0.12; px(d.x,d.y,2,2, sk?'#6a5240':('rgba(34,30,42,'+(0.5+0.3*fl)+')')); });
    px(0,146,480,6,'#1c1826'); px(0,146,480,2,'#2a2433');

    if(showEmp) emperor(sparkOn>0.4, sparkOn);

    const sand = g.createLinearGradient(0,150,0,270); sand.addColorStop(0,'#221c14'); sand.addColorStop(1,'#15100a'); g.fillStyle = sand; g.fillRect(0,150,480,120);
    for(let i=0;i<96;i++){ const sx=(i*53)%480, sy=153+((i*29)%114); px(sx,sy,1,1, (i%5)?'rgba(60,50,34,0.5)':'rgba(18,14,9,0.6)'); }

    g.save(); g.globalCompositeOperation='lighter'; const cg=g.createRadialGradient(254,212,4,254,212,120); cg.addColorStop(0,'rgba(244,150,40,'+(0.08*glow+0.04)+')'); cg.addColorStop(1,'rgba(244,150,40,0)'); g.fillStyle=cg; g.fillRect(0,150,480,120); g.restore();

    brazierGlow(66,glow); brazierGlow(414,glow);

    gladA(226,t,aL);
    g.save(); g.translate(2*282,0); g.scale(-1,1); gladB(282,t,bL); g.restore();

    brazier(66,t); brazier(414,t);

    if(sparkOn>0.55 && lastSpark<=0.55){
      for(let i=0;i<13;i++){ const a=rnd(6.28); parts.push({ x:254, y:222, vx:Math.cos(a)*(0.5+rnd(1.5)), vy:-rnd(1.7), life:1, c: Math.random()<0.5?A:'#f9c45a' }); }
    }
    lastSpark = sparkOn;

    if(sparkOn>0){
      const sxp=254, syp=222;
      g.save(); g.globalCompositeOperation='lighter';
      const rg=g.createRadialGradient(sxp,syp,1,sxp,syp,18*sparkOn); rg.addColorStop(0,'rgba(255,232,182,'+(0.9*sparkOn)+')'); rg.addColorStop(0.4,'rgba(244,150,40,'+(0.5*sparkOn)+')'); rg.addColorStop(1,'rgba(244,150,40,0)'); g.fillStyle=rg; g.fillRect(sxp-20,syp-20,40,40); g.restore();
      g.fillStyle='#ffe9b0'; const n=Math.round(sparkOn*5);
      for(let i=0;i<n;i++){ const a=rnd(6.28), d=rnd(8*sparkOn); g.fillRect(Math.round(sxp+Math.cos(a)*d),Math.round(syp+Math.sin(a)*d),1,1); }
    }

    parts = parts.filter(p=>p.life>0);
    parts.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=0.09; p.life-=0.03; g.globalAlpha=Math.max(0,p.life); px(p.x,p.y,1,1,p.c); }); g.globalAlpha=1;

    dust.forEach(d=>{ d.y-=d.s*0.15; d.x+=Math.sin(t+d.r*9)*0.1; if(d.y<118){ d.y=270; d.x=rnd(480); } g.globalAlpha=0.13+d.r*0.1; px(d.x,d.y,1,1,'#caa46a'); }); g.globalAlpha=1;

    const cw=cv.width, ch=cv.height;
    const S=Math.max(cw/480, ch/270);
    const dz=1+prog*0.14, sc=S*dz;
    const fcx=240, fcy=150+prog*60;
    const dx=cw/2 - fcx*sc + shx*dpr, dy=ch/2 - fcy*sc + shy*dpr;
    mctx.setTransform(1,0,0,1,0,0); mctx.imageSmoothingEnabled=false;
    mctx.fillStyle='#070608'; mctx.fillRect(0,0,cw,ch);
    mctx.drawImage(buf,0,0,480,270,dx,dy,480*sc,270*sc);

    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
})();
</script>
