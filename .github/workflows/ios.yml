name: iOS build & submit (local, no EAS quota)

# Manual trigger from the Actions tab → "Run workflow".
# Builds the iOS app ON the macOS runner with `eas build --local`, which does
# NOT consume the EAS Free-plan cloud build allotment, then submits it to
# App Store Connect. Requires one repo secret: EXPO_TOKEN
# (expo.dev → Account settings → Access tokens). Apple signing credentials are
# pulled automatically from EAS (already set up from earlier cloud builds).

on:
  workflow_dispatch:
    inputs:
      submit:
        description: "Also submit to App Store Connect after building"
        type: boolean
        default: true

concurrency:
  group: ios-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15          # Xcode 16 by default — required by Expo SDK 54 / RN 0.81
    timeout-minutes: 90
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_LOCAL_BUILD_SKIP_CLEANUP: "1"   # keep the build dir so we can read the real pod error
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode (latest stable = 16.x)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode & CocoaPods versions
        run: xcodebuild -version && pod --version

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm i -g eas-cli

      - name: Who am I (sanity check the token)
        run: eas whoami

      - name: Build iOS (.ipa) locally — does not use EAS cloud quota
        run: eas build --local --non-interactive --profile production --platform ios --output "$GITHUB_WORKSPACE/app.ipa"

      - name: Surface the real CocoaPods / build error (only if the build failed)
        if: failure()
        working-directory: ${{ github.workspace }}
        run: |
          echo "===== looking for the kept eas-build working dir ====="
          DIRS=$(find "${TMPDIR:-/tmp}" /var/folders -maxdepth 5 -type d -name "eas-build-*" 2>/dev/null | sort -u)
          echo "$DIRS"
          echo "===== dumping any build / pod / xcode logs (last 200 lines each) ====="
          for d in $DIRS; do
            find "$d" -type f -name "*.log" 2>/dev/null | while read -r f; do
              echo ""; echo "==================== $f ===================="; tail -200 "$f";
            done
            # CocoaPods sometimes leaves the error only in the ios build output captured by eas
            find "$d" -maxdepth 3 -type f -name "Podfile" 2>/dev/null | while read -r pf; do
              echo ""; echo "---- running pod install --verbose in $(dirname "$pf") to reproduce the error ----";
              ( cd "$(dirname "$pf")" && pod install --verbose 2>&1 | tail -200 ) || true;
            done
          done

      - name: Upload .ipa as an artifact (backup you can download)
        uses: actions/upload-artifact@v4
        with:
          name: cert-ios-ipa
          path: app.ipa
          retention-days: 14

      - name: Submit to App Store Connect
        if: ${{ inputs.submit }}
        run: eas submit --non-interactive --profile production --platform ios --path "$GITHUB_WORKSPACE/app.ipa"
