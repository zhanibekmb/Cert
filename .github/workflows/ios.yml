name: iOS build & submit (local, no EAS quota)

# Manual trigger from the Actions tab → "Run workflow".
# Split into two jobs so a transient network blip on submit (e.g. ENOTFOUND
# api.expo.dev) does NOT cost a 40-min macOS rebuild:
#   build  — macOS runner, `eas build --local` (no EAS cloud quota), saves .ipa
#   submit — ubuntu runner (submit needs no macOS), downloads the .ipa and
#            uploads to App Store Connect, retrying on network flakes.
# If submit still flakes: Actions → the run → "Re-run failed jobs" re-runs ONLY
# the fast submit job (the .ipa artifact is reused, no rebuild).
# Requires one repo secret: EXPO_TOKEN (expo.dev → Account → Access tokens).

on:
  workflow_dispatch:
    inputs:
      submit:
        description: "Also submit to App Store Connect after building"
        type: boolean
        default: true

concurrency:
  group: ios-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15          # Xcode 16 by default — required by Expo SDK 54 / RN 0.81
    timeout-minutes: 90
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_LOCAL_BUILD_SKIP_CLEANUP: "1"   # keep the build dir so we can read the real pod error
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode (latest stable = 16.x)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode & CocoaPods versions
        run: xcodebuild -version && pod --version

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm i -g eas-cli

      - name: Who am I (retry on network flakes)
        run: |
          for i in 1 2 3 4 5; do eas whoami && exit 0; echo "whoami attempt $i failed — retrying in 15s…"; sleep 15; done
          exit 1

      - name: Build iOS (.ipa) locally — does not use EAS cloud quota
        run: eas build --local --non-interactive --profile production --platform ios --output "$GITHUB_WORKSPACE/app.ipa"

      - name: Surface the real CocoaPods / build error (only if the build failed)
        if: failure()
        working-directory: ${{ github.workspace }}
        run: |
          echo "===== looking for the kept eas-build working dir ====="
          DIRS=$(find "${TMPDIR:-/tmp}" /var/folders -maxdepth 5 -type d -name "eas-build-*" 2>/dev/null | sort -u)
          echo "$DIRS"
          echo "===== dumping any build / pod / xcode logs (last 200 lines each) ====="
          for d in $DIRS; do
            find "$d" -type f -name "*.log" 2>/dev/null | while read -r f; do
              echo ""; echo "==================== $f ===================="; tail -200 "$f";
            done
            find "$d" -maxdepth 3 -type f -name "Podfile" 2>/dev/null | while read -r pf; do
              echo ""; echo "---- running pod install --verbose in $(dirname "$pf") to reproduce the error ----";
              ( cd "$(dirname "$pf")" && pod install --verbose 2>&1 | tail -200 ) || true;
            done
          done

      - name: Upload .ipa artifact (reused by submit; also downloadable)
        uses: actions/upload-artifact@v4
        with:
          name: cert-ios-ipa
          path: app.ipa
          retention-days: 14
          if-no-files-found: error

  submit:
    needs: build
    if: ${{ inputs.submit }}
    runs-on: ubuntu-latest     # submitting an .ipa does not need macOS
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm i -g eas-cli

      - name: Download the built .ipa
        uses: actions/download-artifact@v4
        with:
          name: cert-ios-ipa
          path: ${{ github.workspace }}

      - name: Submit to App Store Connect (retry on network flakes)
        run: |
          for i in 1 2 3 4 5; do
            eas submit --non-interactive --profile production --platform ios --path "$GITHUB_WORKSPACE/app.ipa" && exit 0
            echo "submit attempt $i failed (likely a transient network blip) — retrying in 25s…"; sleep 25
          done
          echo "All submit attempts failed."; exit 1
